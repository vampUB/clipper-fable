# План монтажа. Кладётся в work/<проект>/clips.yaml
# Время: "1:02:13.5", "62:13", или секунды 3733.5

# Переопределения config.yaml для этого проекта (обычно — координаты вебки)
defaults:
  layouts:
    stream:
      cam: [0.0, 0.0, 0.25, 0.30]   # [x, y, w, h] в долях кадра, см. `frames --grid`
      top_height: 700
  subs:
    replace:                         # исправить ошибки распознавания
      никс: Никс
      "быть бум": Бетбум             # ключ-фраза из нескольких слов; "" — убрать слово
    # censor: true (по умолчанию) — мат сам заменяется на звёздочки: п*здец, бл*дь

clips:
  # Простой клип: один кусок
  - id: 01-rampage
    start: "1:02:13.5"
    end: "1:02:58"
    title: "Никс в шоке от рампаги"
    layout: stream                   # stream | blur | crop
    # Необязательные поля для `check` и отчёта out/report.md (на монтаж не влияют):
    format: хайлайт                  # формат из каталога CLAUDE.md — check следит за разнообразием
    story: "клип о том, как Никс ждал слива, а керри в итоге сделал рампагу"   # обязательно с «в итоге»
    title_alt: ["второй вариант подписи", "третий вариант"]
    desc: "описание под видео"
    tags: [dota2, nix, дота]

  # Хук: сначала 2 секунды кульминации, потом момент целиком.
  # segments склеиваются в указанном порядке — так же вырезаются паузы.
  - id: 02-hook
    segments:
      - ["1:40:21", "1:40:23"]
      - ["1:40:05", "1:40:15"]
      - ["1:40:19", "1:40:30"]       # пропустили 1:40:15–1:40:19 (пауза)
    title: "Он не ожидал такого"
    layout: blur

  # Вебка переезжает между сценами: раскладку/вебку можно задать на каждый сегмент
  - id: 02b-cam-moves
    layout: stream
    segments:
      - {start: "44:12.8", end: "44:15.2", layout: crop,           # вебка на весь кадр — крупно лицо
         layouts: {crop: {rect: [0.0, 0.02, 0.95, 0.95], focus_x: 0.36}}}
      - {start: "45:30.8", end: "45:35.2", cam: [0.0, 0.465, 0.238, 0.235]}   # вебка слева по центру
      - ["55:05.2", "55:12"]                                         # вебка по умолчанию (defaults)

  # Без субтитров, своя высота вебки
  - id: 03-silent
    start: "2:10:00"
    end: "2:10:25"
    subs: false
    layouts:
      stream:
        top_height: 600

  # Динамичный монтаж: холодный старт в слоумо, резкие зумы, надписи,
  # заголовок на весь клип и полоска прогресса
  - id: 04-dynamic
    layout: blur
    title: "Турнир на 5 млн\nи вот последняя драка"   # \n — перенос строки
    title_style: {duration: 0}        # настройки заголовка; 0 — показывать весь клип
    output: {progress_bar: true}
    whisper: {clip_model: large-v3}   # перераспознать речь клипа точной моделью
    subs_skip:                        # не показывать субтитры на неразборчивой речи
      - ["1:01:22.8", "1:01:25.5"]
    segments:
      # хук: кульминация в слоумо (speed 0.5) с зумом 1.35 в точку focus [x, y]
      - {start: "1:01:24.4", end: "1:01:25.9", speed: 0.5, zoom: 1.35, focus: [0.5, 0.42]}
      - {start: "1:01:19.8", end: "1:01:24.4"}
      - {start: "1:01:24.4", end: "1:01:27.6", zoom: 1.25}     # резкий зум на ключевом моменте
      - {start: "1:01:51.6", end: "1:01:55.0", text: "GG", subs: false}  # крупная надпись по центру
