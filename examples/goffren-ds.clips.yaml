  # ДИАЛОГ С ЧАТОМ: «третий спелл жми, нуб» → «ММР в скобочках укажи» → чат пишет (2000), (8800)
  - id: 07-v-skobochkah
    format: диалог с чатом
    story: >-
      клип о том, как чат пишет Гофрену «третий спелл жми, нуб», он требует от советчиков
