# «ГОФРЕН НА СИГНАТУРНОМ ДАРК СИРЕ ВЫНЕС ВРАГОВ В ЩЕПКИ» (нарезка канала ГОФРЕН НАРЕЗКИ, 27:09)
# Две катки: Мипо (краш сервера, 6:05) и Дарк Сир (победа на 26:58). Вебки нет, статичный
# аватар → blur. Донаты озвучены TTS (алерт справа сверху замазан нарезчиком) — who: "донат".
# 0:00–0:20 — холодное открытие нарезчика с плашкой «В ВИДЕО», не брать.
# Рецепт краша (ТП клоном + продажа) в клипы НЕ ставим — только сюжет.
# Границы — по таймкодам transcript_small (точнее на паузах), слова — large-v3 по окну клипа.
defaults:
  layouts:
    blur:
      height: 860
  title:
    duration: 3.5
    uppercase: false
    y: 430
  whisper:
    clip_model: large-v3
    language: ru
  subs:
    y: 1530
    who_y: 1438
    replace:
      мипа: Мипо
      мипу: Мипо
      мипо: Мипо
      mipa: Мипо
      mipo: Мипо
      дарксир: Дарк Сир
      дарксире: Дарк Сире
      дарксира: Дарк Сира
      дарксиром: Дарк Сиром
      бх: БХ
      ммр: ММР
      вальве: Valve
      ларга: Ларго
      ларго: Ларго
      каратнуло: коротнуло

clips:
  # СЖАТАЯ ИСТОРИЯ: «закрой рот» → «как крашить сервак?» → «я по-честному» → «буду заниматься крашем» → краш
  - id: 01-chestnaya-igra
    format: сжатая история
    story: >-
      клип о том, как Гофрен узнаёт из доната, что на Мипо можно крашнуть сервер, обещает
      «попозже, если проигрывать будем», клянётся играть по-честному, начинает
      проигрывать и объявляет «буду заниматься крашем» — и в итоге сервер «не отвечает на
      запросы»: «коротнуло, хорошо»
    title: "честная игра до первого луза"
    title_alt: ["fair play с оговорками", "план б на всякий случай"]
    desc: "goffren / Гофрен на Мипо. честно продержался полторы минуты"
    tags: ["#dota2", "#дота2", "#goffren", "#гофрен", "#meepo"]
    layout: blur
    subs:
      who_y: 1350
      replace:
        mip: Мипо
        ха-ха: ""
        "ха -ха": ""
        "уверен что не хочешь лузом": "ты уверен, что не хочешь лузом"
        "пикнул me push the crash на сервак": "ты пикнул Мипо, чтобы крашить сервак?"
        "во все и": "так, всё, я"
        "крашу все": "крашем. всё"
        "3 т п куплена": "три ТП куплено"
        "3 т п куплено": "три ТП куплено"
    segments:
      - {start: 145.45, end: 147.05, who: "донат"}  # ты пикнул Мипо, чтобы крашить сервак?
      - [147.05, 149.9]                             # а, реально? как крашить сервак, брат? давай рассказывай
      - [176.3, 178.9]                             # попозже сделаем тогда, если про*бывать будем
      - [194.85, 198.3]                            # да я не буду них*я крашить, я на Мипо по-честному играю
      - [229.3, 230.3]                             # да, плохо мне
      - [286.62, 290.75]                           # так, всё, я не хочу это играть, я буду заниматься этим, бл*ть, крашем. всё
      - [301.65, 302.95]                           # три ТП куплено
      - {start: 353.0, end: 357.0, subs: false}    # ТП клона (на экране)
      - {start: 364.8, end: 365.8, subs: false}    # чёрный экран
      - [368.75, 371.9]                            # «Отключение от сервера» → коротнуло, бл*ть. хорошо

  # ЭСКАЛАЦИЯ / ПЕРЕОБУВКА: «забанили за багоюз» → страх → извинения перед Valve → «я горжусь этим»
  - id: 02-sorry-valve
    format: эскалация (переобувка)
    story: >-
      клип о том, как после краша чат поздравляет Гофрена с баном, он пугается за аккаунт,
      извиняется перед Valve на ломаном английском («I'm a Russian poor guy from тайга»), пока на
      экране история матчей с «не засчитано», — и в итоге гордо объявляет: «я пользуюсь багами, я
      горжусь этим»
    title: "раскаяние длилось полминуты"
    title_alt: ["извинения приняты. собой", "чистосердечное наоборот"]
    desc: "goffren / Гофрен после краша сервера. Valve, вы это видите?"
    tags: ["#dota2", "#дота2", "#goffren", "#гофрен"]
    layout: blur
    subs:
      replace:
        багаюз: багоюз
        долбой: долбанец.
        "вальвы айв бин руинд холл дэй": "Valve, I've been ruined whole day,"
        "games my doll total dolboyobs": "games by total долбо*бс."
        taiga: тайга
    segments:
      - [375.4, 377.5]      # поздравляю вас, забанили за багоюз (читает чат)
      - [379.3, 387.7]      # бля, зачем я это на стриме реально делал? надо было стрим вырубить...
      - [389.75, 391.8]     # ну, если аккаунт забанят, будет плохо
      - [395.05, 408.85]     # ребят, так, Valve, I've been ruined whole day... I'm a Russian poor guy from тайга
      - [422.9, 427.7]      # можешь просто закончить стрим. я не буду это ребутать, я пользуюсь багами, я горжусь этим

  # СУПЕРКАТ ОТРИЦАНИЙ: «не крашил?» — «не» → оговорка при враге из той катки → «свои способы» → «Сквидвард»
  - id: 03-alibi
    format: суперкат (алиби)
    story: >-
      клип о том, как донат спрашивает «гофро, не крашил?», Гофрен отвечает «я ничего не крашил»,
      потом при враге из той катки, который пишет «crashed server pls ban him», оговаривается
      «катка, которую я крашил — ой, в смысле…», признаётся «пытался крашнуть и на Дарк Сире,
      на каждом герое свои способы» — и в итоге объявляет, что просто рисовал танцующего
      Сквидварда
    title: "показания путаются"
    title_alt: ["алиби продержалось недолго", "ничего не крашил. почти"]
    desc: "goffren / Гофрен: версия меняется каждые пять минут. какая самая убедительная?"
    tags: ["#dota2", "#дота2", "#goffren", "#гофрен", "#darkseer"]
    layout: blur
    subs:
      replace:
        "игру у габароши": ""
        "чтобы понимали": "чтобы вы понимали,"
        "который окрашивал": "которую я крашил"
        "игра игру не засчитаю не там": "игру не засчитали, там"
        "чтоб крашнулась игра": "это чтоб крашнулась игра?"
        "каждом героев ноте": "каждом герое в доте"
        "на ми покрашешь": "на Мипо крашешь"
    segments:
      - {start: 480.85, end: 483.3, text: "донат: «гофро, не крашил?»"}   # нет, я ничего не крашил
      - {start: 633.55, end: 637.9, text: "в чате враг из той катки:\n«crashed server pls ban him»",
         layouts: {blur: {height: 860, focus_x: 0.85}}}   # это из прошлой катки на Зевсе, чтобы вы понимали, которую я крашил
      - {start: 637.9, end: 645.95, layouts: {blur: {height: 860, focus_x: 0.85}}}   # ой, в смысле, с которым у нас игру не засчитали. там что-то слагало
      - [1138.65, 1150.8]                          # это чтобы крашнулась игра? да. пытался крашнуть на Дарк Сире... свои фишки
      - [1159.05, 1166.1]                          # какую партнёрку? я ничего не... я просто пытался нарисовать танцующего Сквидварда
      - [1169.3, 1175.1]                           # Сквидвард... видите? осуждаю (на экране — гугл «сквидвард танцует»)

  # САМОИРОНИЯ: «настоящая high skill dota» → «профессор» → «игра закончена» (а он лежит мёртвый)
  - id: 04-high-skill
    format: самоирония
    story: >-
      клип о том, как Гофрен обещает закончить «фри-катку» соло, хвастается «взял героя, на
      котором я профессор», а потом умирает, пока смотрел на крипа, — и в итоге с
      таймером возрождения на экране объясняет, что игра закончена и выиграть её невозможно
    title: "профессор на перерыве"
    title_alt: ["соло-победа откладывается", "расслабленный стиль игры"]
    desc: "goffren / Гофрен на Дарк Сире. обратите внимание на таймер внизу"
    tags: ["#dota2", "#дота2", "#goffren", "#гофрен", "#darkseer"]
    layout: blur
    subs:
      replace:
        "крипапа смотреть": "крипа посмотреть"
        "есть игра просто закончу": "есть игра просто закончена"
    segments:
      - [647.15, 650.98]    # так, ну ладно, тут фри-катка. просто Шиву возьму с БКБ и закончу соло
      - [654.0, 656.75]     # вот, я взял героя, на котором я профессор
      - [799.4, 801.8]      # я, бл*ть, пошёл крипа посмотреть, из-за этого умер (на экране таймер возрождения)
      - [805.15, 809.82]    # я просто уже расслабился, потому что игра, если что, закончена. они это никак не выигрывают
      - [814.35, 817.05]    # мало того, что типа они играют против такого Дарк Сира
      - [819.98, 825.7]     # они никогда в жизни это не выигрывают. просто это невозможно уже выиграть. я просто расслабленный
      - [828.2, 830.3]      # то есть игра просто закончена

  # ЭСКАЛАЦИЯ → РАЗВЯЗКА: «мы чё, про*бём?» → «последний барак» → «папа, за что?» → победа «за 40, а не 15»
  - id: 05-za-15-minut
    format: эскалация → развязка
    story: >-
      клип о том, как «лёгкая» катка на Дарк Сире затягивается: «мы чё, про*бём?», «последний
      барак остался», смерть с криком «папа, за что?», последняя драка — и в итоге «Победа сил
      Света» и вывод: игра должна была закончиться за 15 минут, а закончилась за 40
    title: "быстрая катка, как и обещал"
    title_alt: ["игра на 15 минут", "40 минут положительных эмоций"]
    desc: "goffren / Гофрен на Дарк Сире. сколько длилась ваша самая «быстрая» катка?"
    tags: ["#dota2", "#дота2", "#goffren", "#гофрен", "#darkseer"]
    layout: blur
    subs:
      replace:
        "сейчас прием что ли": "мы чё, сейчас про*бём, что ли?"
        "не гони не гони": "гони, гони,"
        "попа попа": "папа, папа,"
        "не ую обещаю": "не уйду, обещаю"
        "врагам что": "врагам"
        закончила: закончилась
    segments:
      - [1266.95, 1269.2]   # мы чё сейчас про*бём, что ли?
      - [1416.7, 1419.4]    # мы так в*бём, я не знаю, но мы в*бём реально
      - [1423.25, 1426.6]   # ладно, последний барак остался, но мы реально можем в*бать, если чё
      - [1459.9, 1468.1]    # ай, бл*ть, гони-гони-гони, гори-гори... папа, папа, за что? (смерть)
      - [1571.3, 1573.0]    # ребят, поехали
      - [1584.5, 1586.6]    # ох, бл*ть, спецэффекты
      - [1608.7, 1613.6]    # я не уйду, обещаю. это просто ужас. бля, хорошая катка на 40 минут выдалась
      - [1622.0, 1628.3]    # фух, ребята... играл игру, которая должна была за 15, а закончилась за 40. море положительных эмоций
      - [1617.05, 1618.45]  # «Победа сил Света» — хорошая катка, спасибо врагам
      - {start: 1618.45, end: 1620.4, subs: false}  # «Победа сил Света» — финальный кадр

  # МИНИ-ГАЙД с провалом: «комбо Дарк Сира для лоу ммр» → «стрейфанулся случайно, ну короче вы поняли»
  - id: 06-gaid
    format: мини-гайд (провал)
    story: >-
      клип о том, как Гофрен вызывается научить лоу ммр комбо Дарк Сира, по шагам объясняет про
      блинк и сурж, идёт показывать на драке — и в итоге: «я что-то стрейфанулся случайно, ну
      короче вы поняли»
    title: "курс для лоу ммр. сокращённый"
    title_alt: ["гайд от профессора", "методичка утеряна"]
    desc: "goffren / Гофрен объясняет Дарк Сира. всё понятно? нам тоже"
