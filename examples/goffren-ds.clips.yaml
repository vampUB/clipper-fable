      начинает подписывать сообщения «(2000)», «(8800)»
    title: "советы принимаются со справкой"
    title_alt: ["ммр в скобочках, пожалуйста", "фейсконтроль для советчиков"]
    desc: "goffren / Гофрен и советы из чата. ваш ммр в скобочках?"
    tags: ["#dota2", "#дота2", "#goffren", "#гофрен"]
    layout: blur
    subs:
      replace:
        "спел жми нуб": "третий спелл жми, нуб."
        "хуй не": "хуйню мне"
        "свою каждый": "свой укажи"
        "10000 меня": "десять тысяч у меня."
        "10000": "десять тысяч?"
        опухоли: ""
    segments:
