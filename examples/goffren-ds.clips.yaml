      - [1220.4, 1230.2]    # короче, лоу ммр, как делать? смотрите, вот комбо Дарк Сира... вам нужен блинк. именно с блинком это работает
      - [1233.0, 1238.9]    # вам нужно нажать сурж на кентавра, подбежать куда-то в центр файта из блинка
      - [1240.4, 1245.35]   # вы нажимаете вот... сурж на крипа, сейчас покажу
