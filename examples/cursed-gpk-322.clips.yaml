# Курсед: турнир, СФ 13/4/11 → конфликт в команде → вылет на Эмбере. Без вебки.
defaults:
  layouts:
    blur:
      height: 860
  title:
    duration: 3.5
    uppercase: false
    y: 430
  whisper:
    clip_model: large-v3
  subs:
    y: 1530
    replace:
      пиздец: п*здец
      п**дец: п*здец
      хуйня: х*йня
      х**ня: х*йня
      х**ни: х*йни
      х**ню: х*йню
      хуйней: х*йнёй
      хуйкой: х*йнёй
      ебаная: еб*ная
      ебаный: еб*ный
      ебаного: еб*ного
      въебали: в*бали
      отъебет: от*бёт
      нахуй: нах*й
      блять: бл*ть
      эмбер: Эмбер
      спирите: Спирите
      течисе: Течисе
      течите: Течисе
      мангёку: Мангеку
      мадгёку: Мангеку
      матгиоку: Мангеку

clips:
  # ХАЙЛАЙТ: два Реквиема — двойное убийство и «убейте его!»
  - id: 01-rekviem
    title: "реквием по мечте"
    layout: blur
    subs:
      replace:
        найт: найс
        nice: найс
        реди: рэди
    subs_skip:
      - [668.0, 671.62]       # «у меня колба, парни…» — large-v3 тут путается
      - [808.7, 809.55]       # «вини, бей его / не бей его / впей его» — модели расходятся
    segments:
      - [668.0, 678.95]       # Реквием, двойное убийство… найс, найс, хорошо, нас устраивает
      - [800.5, 813.35]       # Реквием в драке: убейте его! убейте! найс! дальше рэди прыгать!

  # ХАЙЛАЙТ: Блэкхол Энигмы + Реквием СФа — двойное
  - id: 02-kombo
    title: "энигма + сф = любовь"
    layout: blur
    subs_skip:
      - [1150.35, 1150.56]    # «коп» — неразборчиво
    segments:
      - [1150.0, 1162.5]

  # ЭСКАЛАЦИЯ: «урона нет» → «у тебя в башке дырка» → «я хочу ГГ написать… почему ты ноешь?»
  - id: 03-himiya
    title: "командная химия"
    layout: blur
    whisper: {clip_model: null}       # голоса перебивают друг друга — small здесь разборчивее
    subs:
      replace:
        урона: урона
        пинга: пинганул
        антимагы: Антимага
        перестанут: перестань
    subs_skip:
      - [1449.55, 1449.85]    # «ну»
      - [1461.45, 1462.95]    # неразборчиво
      - [1464.95, 1465.75]    # «они ной» — неразборчиво
    segments:
      - [1379.9, 1384.35]     # да что твой Лотос? урон где взять? урона нет! — я урон
      - [1445.4, 1453.15]     # я не на тебя пингую даже! я пинганул случайно! как ты на Течисе должен Антимага словить?
      - [1457.9, 1468.85]     # у тебя в башке дырка. я хочу ГГ написать… ты ноешь! почему ты ноешь? ладно, всё

  # ДИАЛОГ: «вам просто впадлу друг с другом в лобби находиться»
  - id: 04-lobbi
    title: "семейный психолог на связи"
    layout: blur
    whisper: {clip_model: null}
    subs:
      replace:
        падлу: падлу
    subs_skip:
      - [1488.35, 1489.25]    # «на 50-й/десятой минуте» — модели расходятся
    segments:
      - [1485.0, 1489.2]      # почему никто с этим не говорит? вы слышите, что он несёт? ГГ напишет…
      - [1496.2, 1500.25]     # вам просто впадлу друг с другом в лобби находиться. — а вам не впадлу?
      - [1505.5, 1510.85]     # мы в*бали фришные серии только потому, что он ныл. и сейчас этим занимаемся…

  # ЦЕЛЬНЫЙ ОТРЕЗОК: «ты коллил, я делал… что ты просто мискликнул?»
  - id: 05-razbor
    title: "разбор полётов"
    layout: blur
    subs:
      replace:
        колю: коллю
        колил: коллил
        файл: файт
        глиммеркейпом: Глиммеркейпом
        крофас: Крофас
        урса: Урса
    segments:
      - [1514.2, 1534.15]

  # ЦЕЛЬНЫЙ ОТРЕЗОК: стратегия «от шефа» — в ТГ, нет, в конфу, нет, в дискорд
  - id: 06-strategiya
    title: "стратегия под грифом «секретно»"
    layout: blur
    subs:
      replace:
        тг: ТГ
        конфу: конфу
    segments:
      - [1615.3, 1626.65]

  # СЕТАП → РАЗВЯЗКА: «ни сантиметра на карте… папа на Эмбере пошатает каточку» → GPK убил троих → вылет
  - id: 07-papa
    title: "сейчас папа пошатает каточку"
    layout: blur
    subs:
      replace:
        собачка: собачья
        влетаем: вылетаем
        пищим: пишем
        отъебать: от*бёт
    subs_skip:
      - [1655.85, 1657.1]     # «и никто тебя поиграть закроет» — неразборчиво
    segments:
      - [1633.2, 1638.95]     # в этой мы не пишем ГГ. мы не даём им ни сантиметра на карте, как говорил один великий человек
      - [1651.2, 1663.45]     # он меня от*бёт в ноль на Тине… не ссыте, девочки, сейчас папа на Эмбере пошатает каточку
      - {start: 2231.5, end: 2236.4, subs: false}   # GPK: «убил троих подряд», «Вы мертвы»
      - [2817.9, 2820.05]     # ну, парни, всем спасибо за участие, как говорится
      - [2823.7, 2831.95]     # такая вот х*йня, ребята… вылетаем мы последние с турнира. в очередной раз

  # ХАОС В ВОЙСЕ: «Вини, ТП! Вини, ТП!» → «Вини думает»
  - id: 08-vini
    title: "тп нажимается силой мысли"
    layout: blur
    whisper: {clip_model: null}
    subs:
      replace:
        tp: ТП
        teleport: телепорт
        блинг: блинк
    segments:
      - [2721.5, 2728.45]     # Вини, просто ТП. Вини, ТП. Вини, ТП. Вини, телепорт нажми! — да не могу… — вот сейчас ТП на базу
      - [2733.3, 2738.6]      # Вини живёт, подождите… Вини, блинк. ой, Вини думает. Вини живёт, вроде бы

  # ХАЙЛАЙТ: «жди, жди, жди… раз» — «я убил его!»
  - id: 09-terpenie
    title: "терпение — тоже скилл"
    layout: blur
    subs:
      replace:
        у: убил
        белого: его
    segments:
      - [608.4, 619.0]

  # СЕТАП → РАЗВЯЗКА: «играем с Мангёку» → «спасибо за участие, Мангёку»
  - id: 10-sostav
    title: "состав мечты"
    layout: blur
    subs:
      replace:
        тим: Тима
        никса: Никса
        фейда: Фейда
    subs_skip:
      - [5.99, 6.03]          # «и» из «Тим и Никса»
    segments:
      - [5.6, 13.75]          # тима Никса отказались от нашей замены на Фейда… поэтому мы играем с Мангеку
      - [2831.85, 2833.85]    # спасибо за участие, Марк, Мангеку
