# День рождения Курседа: впервые за 5 лет включил вебку (тёмная комната, лицо почти не видно),
# обзор подарков от друзей/стримеров, подарки в Доте, Gartic Phone (рисует, чат угадывает),
# музыкальный квиз (= cursed-hits, отсюда НЕ брать: 15:07–28:36), голосование за премию стримеров.
# Вебка тёмная → eq (яркость/контраст) в раскладке. Субтитры — автосубтитры YouTube.
defaults:
  layouts:
    blur:
      height: 1000
      focus_x: 0.7
      eq: "brightness=0.03:contrast=1.15:gamma=1.45:saturation=1.1"
  title:
    duration: 3.5
    uppercase: false
    y: 330
  whisper:
    clip_model: null
  subs:
    y: 1500
    replace:
      молстроя: Меллстроя
      мостроя: Меллстроя
      касината: "Кай Сената"
      кайсината: "Кай Сената"
      косина: "Кай Сенат"
      бустера: Бустера
      бустер: Бустер
      тёмыча: Тёмыча
      ависа: Авис
      юника: Юника
      юник: Юник
      лину: Лину
      лина: Лина
      крит: Крид
      сайджа: Сейджуро

