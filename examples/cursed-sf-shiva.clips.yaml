# Курсед (ник «привет») на маг. СФе через Шиву, паб. В команде: DendiReborn (Спирит Брейкер,
# «Бара»), ОХРАНА СЕРВЕРА, Энигма. Против: Лон Друид («мишка»), Сларк, Акс, Тини.
# Весь стрим донатеры ставят свои треки (подписчики) и мем «Патрульная машина».
# Итог: «Победа сил Света» на 25:13 (в истории матчей — победа 41:46).
# Вебки нет → blur. Субтитры — автосубтитры YouTube (transcript.json); мат там вырезан.
# Реплики тиммейтов в войсе тише (−18…−25 dB), Курсед громкий (−5…−12 dB).
defaults:
  layouts:
    blur:
      height: 860
  title:
    duration: 3.5
    uppercase: false
    y: 430
  whisper:
    clip_model: null
  subs:
    y: 1530
    replace:
      сф: СФ
      энигма: Энигма
      акс: Акс
      акса: Акса
      бара: Бара
      сларк: Сларк
      лд: ЛД
      инвис: инвиз
      инвист: инвиз
      "крис мал": Крид
      "на пярить": пиарить

