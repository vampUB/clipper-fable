# «КУРСЕД ВПЕРВЫЕ СЫГРАЛ НА МАГИЧЕСКОМ СФЕ В 7.41f» (канал Zxcursed Rofls, 12:17, уже смонтированная нарезка).
# Одна катка: Курсед = sv_cheats 1, СФ мид за Тьму. Союзники: Висп «просто так» (керри, 21/4/23),
# Энигма «barbero de panes», Никс «auch», Дизраптор «smertin». Враги: Хускар «faker» и др.
# Итог: 34:39, Победа сил Тьмы 60:29, СФ 15/5/19. Вебки нет → blur. Голос один — Курсед (+ читает чат).
defaults:
  layouts:
    blur:
      height: 860
  title:
    duration: 3.5
    uppercase: false
    y: 430
  whisper:
    # общий transcript.json собран из оконных прогонов large-v3 (точные таймкоды; оригинал —
    # transcript.large-full.json). Точная модель на коротких кусках клипа галлюцинирует («Pepsi»).
    clip_model: null
    language: ru
  subs:
    y: 1530
    who_y: 1438
    replace:
      курсов: Курсед
      акаши: Акаши
      сейджера: Сейджуро
      сфа: СФа
      сфе: СФе
      энигмы: Энигмы
      веспа: Виспа
      виспа: Виспа
      хускар: Хускар
      хас: Хас
      никсе: Никсе
      сэнтри: сентри
