  - id: 01-skuf
    format: оффтоп (цельный отрезок)
    story: >-
      клип о том, как чат обвиняет Курседа в скуфстве, он отбивается аргументом «помылся, побрился
      и заплатил за квартиру», советуется, в какой цвет перекраситься, а на «найс пул» в истории
      матчей признаёт: пул ох*енный, жизнь помотала, — и в итоге сам же подтверждает диагноз
    title: "железное алиби"
    title_alt: ["аргументы против скуфства", "не скуф: оплатил квартиру"]
    desc: "zxcursed доказывает чату, что он не скуф. убедил?"
    tags: ["#dota2", "#zxcursed", "#курсед", "#скуф"]
    layout: blur
    segments:
      - {start: 0.04, end: 1.9, who: "читает чат"}   # мне кажется, Курсед, ты оскуфел? (0.0 — чёрный кадр)
      - [1.9, 28.0]                                   # … ну а чё поделать, жизнь помотала, видимо (дальше — смена экрана)

