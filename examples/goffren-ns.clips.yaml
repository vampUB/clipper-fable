      - [258.76, 266.73]     # не форсить меня драться в Визажа и Апарата, я же просто хочу добить крипов. Ну почему же тебе так хочется?
      - [267.0, 269.7]       # Не дождаться пятой минуты и зафорсить меня вот на это
      - [273.2, 274.88]      # Ну, у него же просто шило в жопе
      - [277.23, 287.94]     # ты же видишь, я уже дал в крипа... 40 голды на дороге не валяются
      - [296.3, 314.24]      # Первый раз в жизни стоит лайн с Баланаром... синий днём — всё... ночью красный
      - [314.24, 326.1]      # синий свет психологически опасности не представляет... всё просто
      - [327.2, 333.4]       # Даже вот для долбо*бов сделали. Но нет, на Верке думает, что мы будем всех еб*шить

  # ХАЙЛАЙТ С ПРЕДЫСТОРИЕЙ: «Верка свела с ума» → «давай попробуем, Вер» → «я буду жить!» →
