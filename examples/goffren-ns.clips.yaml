# «ГОФРЕН ПОКАЗАЛ ИДЕАЛЬНОЕ ИСПОЛНЕНИЕ НА НСЕ» (нарезка канала ГОФРЕН НАРЕЗКИ, 28:56)
# Одна катка: Гофрен (ник kutab) — Night Stalker (Баланар) за Тьму. Союзники: Ember Spirit
# (Fooshaz), Windranger (Andy Cartwright, «Верка»), Grimstroke (КРУШЕГОЛОВ), Riki.
# Враги: Kunkka (syndereN), Visage-керри, Ancient Apparition, Primal Beast (727), Winter Wyvern.
# Свет вёл 17:14 к 15-й минуте, дальше камбэк Тьмы, победа 50:30 на 38-й минуте.
# 0:00–1:20 — отходняк после проигрыша на Бруде (это катка из второго ролика, goffren-brood).
# Вебки нет (статичный аватар) → blur, title.y 430, subs.y 1530.
# Слова — large-v3 по окнам клипов; два места, где large-v3 на длинном окне потерял фразу или
# съехал на 2–4 с (13:46–14:02 и 23:25–23:41), перераспознаны узким окном и вклеены в кэш.
defaults:
  layouts:
    blur:
      height: 860
  title:
    duration: 3.5
    uppercase: false
    y: 430
  whisper:
    clip_model: large-v3
    language: ru
  subs:
    y: 1530
    who_y: 1438
    replace:
      баланар: Баланар
      баланаре: Баланаре
      баланара: Баланара
      баланаром: Баланаром
      эмбер: Эмбер
      визажа: Визажа
      визаж: Визаж
      fight: файт

clips:
  # ЦЕЛЬНЫЙ СПОР → РАЗВЯЗКА: Эмбер в чате учит «use spells in daytime» → Гофрен кипит →
  # ночь, драка, два убийства → «ну что, Эмбер, что ты мне скажешь?» → «тихий час у Баланара»
  - id: 01-tihiy-chas
    format: спор → развязка
    story: >-
      клип о том, как союзный Эмбер пишет в чат Гофрену на Найт Сталкере «use spells in daytime»
      и просит сайленс с барабанами, Гофрен кипит, что днём Баланару нечего делать, «надо
      подождать 25 секунд», дожидается ночи, убивает двоих — и в итоге объясняет Эмберу, что днём
      у Баланара тихий час, он в гробу спит
    title: "тихий час у баланара"
    title_alt: ["днём баланар не работает", "гофрена учат играть на нсе"]
    desc: "goffren / Гофрен на Night Stalker. по РП днём положено спать, все претензии ночью"
    tags: ["#dota2", "#дота2", "#goffren", "#гофрен", "#nightstalker"]
    layout: blur
    subs:
      replace:
        "юкин ю спелс": "You can use spells,"
        "живу ебки": "уёбки"
        "типы мне": "типа мне"
        "макс silence кью в drums бро плиз": "Max silence Q with drums, bro, please."
        наебанутый: "Ну, ебанутый!"
        "так те": "так тебе"
        "было бы жить": "было ждать"
        "но one cares": "No one cares,"
        "day time": "daytime."
        сплыв: спеллы
        "своем на сплю": "своём сплю"
        "в просто в": "просто в"
    segments:
      - {start: 741.1, end: 751.1,
         inset: {rect: [0.29, 0.555, 0.33, 0.145], width: 900, at: [540, 250], from: 2.5}}   # как меня поражают такие долбо*бы? You can use spells, Баланар... 2к ММР и мне чё-то пишут?
      - {start: 756.45, end: 768.4,
         inset: {rect: [0.29, 0.555, 0.33, 0.145], width: 900, at: [540, 250]}}   # Max silence Q with drums bro please... надо подождать 25 секунд
      - {start: 769.95, end: 779.65,
         inset: {rect: [0.29, 0.555, 0.33, 0.145], width: 900, at: [540, 250], from: 6.3}}   # No one cares, you can use spells in daytime. Я могу нажимать днём, если файт рядом
      - {start: 808.5, end: 814.5, subs: false}     # ночь, драка: kutab прерывает серию
      - {start: 818.5, end: 823.5, subs: false}     # второе убийство
      - [826.4, 841.4]                               # Ну что, Эмбер, что ты мне сейчас скажешь? Богу ночи... пришёл и разъ*бал всех
      - [843.45, 849.45]                             # Как ты смеешь что-то говорить мне, когда дневное время? Не буди меня
      - [850.27, 863.93]                             # Я в спячке плюс фармлю. По РП... тихий час у Баланара
      - [867.0, 872.05]                              # я в гробу своём сплю, лежу просто в гробу сплю

  # МИНИ-ГАЙД: Виндра форсит драку днём → «синий днём — значит неопасен, даже для
  # долбо*бов подсветили»
  - id: 02-svetofor
    format: мини-гайд
    story: >-
      клип о том, как союзная Виндраннерша в первые минуты тащит Гофрена драться днём, а он
      хочет просто добить крипов, — и в итоге он объясняет: Найт Сталкер днём синий, значит
      опасности не представляет, ночью красный, «даже для долбо*бов сделали»
    title: "баланар объясняет светофор"
    title_alt: ["синий значит не трогай", "40 голды на дороге не валяются"]
    desc: "goffren / Гофрен на Night Stalker. запомните раз и навсегда: синий спит, красный охотится"
    tags: ["#dota2", "#дота2", "#goffren", "#гофрен", "#nightstalker"]
    layout: blur
    subs:
      replace:
        энди: Энди
        переспел: перед спеллом
        "идешь чтобы я": "идёшь-то? Я"
        крипла: крипа
        варки: Верке
