    title_alt: ["сказал буду жить и умер", "верка свела с ума"]
    desc: "goffren / Гофрен на Night Stalker. kutab это он, если что"
    tags: ["#dota2", "#дота2", "#goffren", "#гофрен", "#nightstalker"]
    layout: blur
