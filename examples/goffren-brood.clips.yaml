    format: хот-тейк
    story: >-
      клип о том, как Гофрен подозревает, что вражеский ДК с ником 9mice переливает калибровку
      на 2к, рассуждает, что переливщики заработали бы больше курьерами в Яндексе, — и в итоге
      находит им единственное оправдание: «если у них реально нету ног»
    title: "переливщики против курьеров"
    title_alt: ["единственное оправдание переливщика", "яндекс еда ждёт"]
    desc: "goffren / Гофрен про переливы калибровки. курьером честнее?"
    tags: ["#dota2", "#дота2", "#goffren", "#гофрен"]
    layout: blur
    subs:
      replace:
        "9 -майс": 9mice
        "9-майс": 9mice
        "9 майс": 9mice
        "2 карангом": двухтысячным рангом
