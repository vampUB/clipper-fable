      клип о том, как Гофрен весь матч ноет на сет для Бруды, который меняет вид паутины:
      «меня тошнит от сеток», «сетка с соплями», «в кошмарах такое не снилось», — и в итоге
      на 17-й минуте признаётся, что так и не понял, где граница паутины: «мозг вообще не может
      адаптироваться»
