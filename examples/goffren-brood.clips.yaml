      - [27.4, 30.97]         # Они на стриме сидят, вот просто какая-нибудь х*йня сейчас будет
      - [175.38, 187.3]       # Почему на него никто не нападал на Фениксе? и крипа въ*бал... он мне денаить крипов идёт
      - [195.32, 204.46]     # Ладно, Феникс, спасибо... ты вообще мои мысли читаешь
      - [216.9, 218.76]       # Всё, я умер
      - [222.32, 229.06]      # специальный руинит... за стримснайпили
      - [235.6, 239.34]      # Это конец моей Бруды

  # СУПЕРКАТ НЫТЬЯ: сетки (паутина скина Бруды) — «меня тошнит от сеток» → «мозг не может
