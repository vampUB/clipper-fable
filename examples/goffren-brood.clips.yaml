# «ГОФРЕН НА БРУДЕ ВЫЧИСЛИЛ ПЕРЕЛИВЕРОВ В ЛОББИ» (нарезка канала ГОФРЕН НАРЕЗКИ, 25:35)
# Одна катка: Гофрен — Broodmother за Тьму (керри: тиммейт «ГОЛОД» поставил иконку на его хардлайн
# и взял Ликана). Союзники: Феникс (по словам Гофрена — «переливает / руинит»), Шейкер, Ликан
# (ГОЛОД). Враги: Dragon Knight 9mice (его Гофрен вычисляет по Дотабаффу), Нага, Пак, Титан.
# Тьма вела 22:17 к 26-й минуте, потом свет разнёс до 33:22 — проигрыш. В конце экран «лучший
# игрок — 9mice, Dragon Knight». Следующая катка — goffren-ns (там он начинает с «я же сказал,
# я про*бу на Бруде»).
# Хайлайтов у Гофрена в этой игре нет (серии убийств — у союзников).
# Вебки нет → blur, title.y 430, subs.y 1530.
defaults:
  layouts:
    blur:
      height: 860
  title:
    duration: 3.5
    uppercase: false
    y: 430
  whisper:
    clip_model: large-v3
    language: ru
  subs:
    y: 1530
    who_y: 1438
    replace:
      бруде: Бруде
      бруды: Бруды
      брудесе: Бруде
      феникс: Феникс
      фениксе: Фениксе
      голод: Голод
      драгонайта: Драгонайта
      драгонайт: Драгонайт
      дотабаф: Дотабафф

clips:
  # СЕТАП → РАЗВЯЗКА: Голод отжал хардлайн → «они на стриме сидят, какая-нибудь х*йня сейчас
  # будет» → Феникс ворует и денаит крипов → смерть → «это конец моей Бруды»
  - id: 01-konec-brudy
    format: сетап → развязка
    story: >-
      клип о том, как тиммейт с ником «Голод» забирает у Гофрена его хардлайн, Гофрен на
      драфте предсказывает «какая-нибудь х*йня сейчас будет», на линии союзный Феникс денаит
      его крипов, — и в итоге Гофрен умирает и ставит диагноз: «специальный руин, это конец
      моей Бруды»
    title: "предсказал свою бруду"
    title_alt: ["голод отжал хардлайн", "феникс читает мысли"]
    desc: "goffren / Гофрен на Брудмазер. Феникс, ты за кого вообще?"
    tags: ["#dota2", "#дота2", "#goffren", "#гофрен", "#broodmother"]
    layout: blur
    subs_skip:
      - [184.9, 186.2]       # «натаскивает бельстрите» — неразборчиво
    subs:
      replace:
        "на кэре сыграл на пэле": "на керри сыграл? На ПЛе?"
        "просто какая": "просто какая-нибудь"
        "крипов ебал": "крипа въебал"
        "все мне плохо как играть": "всё, мне плохо, я не знаю, как играть."
        "он не динать крипов идет": "он мне денаить крипов идёт"
        "динать крипов идет": "он мне денаить крипов идёт"
        веникс: Феникс
        малорик: ""
        "я умер": "Всё, я умер"
        "специально руинит": "специальный руин"
        "специальный руинит": "специальный руин"
