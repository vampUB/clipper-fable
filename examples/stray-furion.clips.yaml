# Stray228 — «СТРЕЙ ХОТЕЛ ЗАРУИНИТЬ НА ФУРИОНЕ НО УСЛЫШАЛ…» (канал «Лучшее со Stray 228», 2020, 7.25).
# Стрей — Фурион (ник «Сырок»). Саппорт «168» пошёл Снайпером на мид — Стрей пикнул Фуриона, чтобы
# заруинить, потом передумал и тащит (дабл-килл на 4:15, «убив ЧЕТВЕРЫХ» на 19:27).
# Тиммейты: Сларк (yu?, в войсе), Венга / Венгад (edeNdix, Vengeful Spirit, 28 смертей), Разор (Zaampel).
# Враги: Морф (GOFLEX), Пудж, Лич, Бэйн, Шторм. Проигрыш.
