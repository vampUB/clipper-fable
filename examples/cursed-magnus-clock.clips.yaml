# v10 (cursed-magnus-clock): форматы и подписи — нормально; концы обрезаны, спор с Клоком
# раздроблен на несколько клипов, концовка видео потеряна, нытья мало — см. CLAUDE.md, раздел 16.
# 01-bkb пользователь назвал безыдейным, скучным, обрезанным.
# Курсед на Магнусе (тройка) + хейтер на Клокверке (ionwan2go, «302?»). Без вебки — blur.
# Котл = aeokfl (мирит в чате). Счёт 41:57 по убийствам, но «Победа сил Света». Магнус 4/13.
defaults:
  layouts:
    blur:
      height: 860
  title:
    duration: 3.5
    uppercase: false
    y: 430
  whisper:
    clip_model: large-v3
  subs:
    y: 1530
    replace:
      магнус: Магнус
      магнусе: Магнусе
      магнуса: Магнуса
      клока: Клока
      клыка: Клока
      клоке: Клоке
      клаке: Клоке
      котл: Котл
      мираной: Мираной
      мирана: Мирана
      ларго: Ларго
      вкб: БКБ
      бкб: БКБ
      кезу: Кезу
      манч: мантий

clips:
  # СЕТАП → РАЗВЯЗКА: «сейчас у папы появится BKB» → BKB так и не появился, зато у Ларго
  - id: 01-bkb
    format: обещание → реальность
    story: "клип о том, как Курсед обещает, что с BKB игра заиграет новыми красками, а в итоге BKB нет, виноваты то ли Магнус, то ли команда, а BKB появился у вражеского Ларго"
    title: "бкб появился. у ларго"
    title_alt: ["игра заиграла красками. вражескими", "папа фармит, ларго покупает"]
    desc: "zxcursed / Курсед на Магнусе: краски так и не завезли. а ты бы кого винил?"
    tags: [dota2, zxcursed, курсед, magnus, бкб]
    layout: blur
    subs:
      replace:
        "блэкинг бар": Black King Bar
        бкп: БКБ
        ларга: Ларго
        магнусы: Магнуса
        "че это вина": "чья это вина"
    segments:
      - [644.6, 650.25]       # сейчас у папы появится Black King Bar и игра заиграет новыми красками
      - [707.55, 713.45]       # не может Магнус зафармить БКБ… чья это вина? Магнуса или команды? я не могу понять
      - [715.85, 718.95]       # Ларго, бл*дь, БКБ (в чате: «У Largo врага есть Black King Bar»)

  # САМОИРОНИЯ: сам попросился на тройку → не добил крипов → «я создан для оффлейна»
  - id: 02-offlane
    format: самоирония
    story: "клип о том, как Курсед сам просится на Магнуса тройкой, нервничает и не добивает крипов, а в итоге заявляет, что создан для оффлейна"
    title: "рождён для тройки. не для крипов"
    title_alt: ["талант не скроешь", "прирождённый оффлейнер"]
    desc: "zxcursed / Курсед на оффлейне: скажу честно — нервничает"
    tags: [dota2, zxcursed, курсед, magnus, оффлейн]
    layout: blur
    segments:
      - [14.8, 19.0]          # тройку, тройку готов. я на Магнусе… я на Магнусе хочу
      - [160.2, 176.3]        # ай-яй-яй… не добил вип-крипы… нервничаю, когда их надо бить… создан для оффлейна

  # ЭСКАЛАЦИЯ: «Магнус всё проконтролит» → «я ещё проявлю себя» → «как играть такой драфт» → «дота — это шахматы» → умер: «Магнус создал момент, как обычно»
  - id: 03-kontrol
    format: эскалация
    story: "клип о том, как Курсед обещает, что Магнус всё проконтролирует, потом успокаивает, что ещё проявит себя, потом винит драфт и в итоге, лёжа мёртвым, говорит: Магнус создал момент, как обычно"
    title: "временные трудности"
    title_alt: ["контроль уровня магнус", "всё идёт по плану"]
    desc: "zxcursed / Курсед: дота — это шахматы. сколько ходов до контроля?"
    tags: [dota2, zxcursed, курсед, magnus]
    layout: blur
    segments:
      - [230.6, 235.35]       # ничего страшного, Магнус всё проконтролит в этой игре. не беспокойтесь, ребята
      - [293.45, 297.6]       # ну я только начал, на самом деле, я ещё проявлю себя, ребята, вы не беспокойтесь
      - [503.6, 505.55]       # ну как мне на Магнусе играть такой драфт, бл*ть
      - [508.6, 510.42]       # понимаете, дота — это шахматы, ребята
      - [763.5, 765.95]       # (Магнус мёртв) ну Магнус создал момент, как обычно

  # КОНФЛИКТ, ОТРЕЗОК С ПОДРЕЗКОЙ: «ты не разговариваешь, ты играешь» → «пять минут сидел, думал, что ответить»
  - id: 04-spor
    format: конфликт (отрезок с подрезкой)
    story: "клип о том, как Курсед требует от Клока молчать и играть и гордо ставит его на место, а в итоге в ответ слышит: пять минут сидел, думал, что ответить"
    title: "переговоры зашли в тупик"
    title_alt: ["кто молчит — тот играет", "поставил на место. наверное"]
    desc: "zxcursed / Курсед против Клокверка. кто победил в споре?"
    tags: [dota2, zxcursed, курсед, clockwerk, хейтер]
    layout: blur
    subs:
      replace:
        "мне это говоришь": "ты мне это говоришь"
    segments:
      - [686.7, 687.65]       # ты мне это говоришь?
      # 687.8–691.9 — оскорбление матери, вырезано
      - [692.0, 707.3]        # всё, всё… закрыл, да? играешь? …ты не разговариваешь, ты играешь… ты тоже должен молчать. поставил на место
      - [728.4, 732.4]        # жёстко ты меня на место поставил. пять минут сидел, да? думал, что ответить

  # ДИАЛОГ-СУД: «Котл, скажи, я же нормально играю» → «хоть один мув нормальный был?»
  - id: 05-kotl
    format: диалог (свидетель)
    story: "клип о том, как Курсед после смерти (4/10) просит Котла подтвердить, что он нормально играет, Котл списывает всё на анлаки, а в итоге хейтер спрашивает, был ли хоть один нормальный мув"
    title: "свидетель защиты"
    title_alt: ["котл, подтверди", "адвокат на котле"]
    desc: "zxcursed / Курсед на Магнусе. а что бы ты ответил за Котла?"
    tags: [dota2, zxcursed, курсед, magnus, keeperofthelight]
    layout: blur
    subs:
      replace:
        "он лаки": анлаки
        молосит: молотит
    segments:
      - [862.75, 864.75]      # мама, бл*, это чё за х**? (умер)
      - [865.3, 871.7]        # Котл, ну скажи, я же нормально играю. — у тебя просто реально анлаки. — хоть один мув нормальный был у тебя?

  # СЕТАП → РАЗВЯЗКА: «игра выигрывается, как только ты закрыл своё» → «замучу Клока» → «Победа сил Света»
  - id: 06-mute
    format: сетап → развязка
    story: "клип о том, как Курсед решает, что игра выигрывается, только когда Клок молчит, и мутит его, а в итоге — Победа сил Света"
    title: "лучший предмет — кнопка мут"
    title_alt: ["рецепт победы: замутить клока", "мут — сильнейший саппорт"]
    desc: "zxcursed / Курсед: 41 убийство против 57 — и победа. совпадение?"
    tags: [dota2, zxcursed, курсед, clockwerk, мут]
    layout: blur
    subs_skip:
      - [1295.5, 1297.6]      # «против увижу …» — неразборчиво
    subs:
      replace:
        размылил: размутил
        иблище: е*лище
        клака: Клока
        "в общем можем": "мы вообще можем"
        "никогда не уезжать": "тебя никогда не увижу"
    segments:
      - [871.85, 880.55]      # о, ты меня размутил? — да, да. — ну чё, игра выигрывается, да? как только ты закрыл своё? — нет… — нет, ты закрыл
      - [927.9, 934.3]        # а мы вообще можем реально выиграть, если я просто замучаю Клока. — он меня тоже замутил. — ладно, давайте я замучаю Клока
      - [1292.8, 1297.4]      # трон падает → «Победа сил Света»; всё, надеюсь, я тебя никогда не увижу

  # СЖАТАЯ ИСТОРИЯ: курьер «с подарком» — три мантии интеллекта хейтеру → без байбека «из-за мантий»
  - id: 07-podarok
    format: сжатая история
    story: "клип о том, как Курсед шлёт Клоку курьера с тремя мантиями интеллекта «в подарок», а в итоге сам остаётся без байбека — из-за мантий"
    title: "гуманитарная помощь клоку"
    title_alt: ["подарок от чистого сердца", "инвестиции в интеллект"]
    desc: "zxcursed / Курсед: что бы ты положил в курьера хейтеру?"
    tags: [dota2, zxcursed, курсед, clockwerk, хейтер]
    layout: blur
    segments:
      - [961.75, 967.35]      # теперь моя очередь. Клок, тебе кура моя идёт. с подарком (в курьере 3 Mantle of Intelligence)
      - [987.6, 990.2]        # ты только придумал мантии выкидывать (пинг «Здесь Mantle of Intelligence»)
      - [1074.4, 1077.8]      # вот из-за этих мантий у тебя и бая не было… понял?
      - [1083.95, 1087.85]     # нету бая, да, из-за мантий? погодите, я что-то выкидывал или нет?

  # ПЕРЕОБУВКА + МОМЕНТ: «с Мираной готов пободаться» → «не всё / всё / не всё, на что я способен» → «Вы мертвы»
  - id: 08-sposoben
    format: переобувка
    story: "клип о том, как Курсед идёт драться с Мираной, по ходу трижды передумывает, всё ли это, на что он способен, а в итоге умирает"
    title: "лимит возможностей найден"
    title_alt: ["способен на всё. почти", "спор с самим собой"]
    desc: "zxcursed / Курсед на Магнусе против Мираны. так всё или не всё?"
    tags: [dota2, zxcursed, курсед, magnus, mirana]
    layout: blur
    subs_skip:
      - [1031.0, 1032.1]      # «встала» — неразборчиво
    subs:
      replace:
        кес: Кез
        вайнулс: вайнулся
    segments:
      - [1023.95, 1027.75]    # а ну-ка, вот с Мираной я готов пободаться. ну-ка, дура, иди сюда
      - [1032.0, 1045.65]     # драка… не-не-не, братанчик, это не всё… ладно, это всё… не, погоди, это всё-таки не всё, на что я способен
      - [1049.1, 1050.45]     # «Вы мертвы»; там Кез вайнулся

  # МИНИ-ГАЙД: защита базы на блефе — «они думают, у нас байбеки есть»
  - id: 09-baibek
    format: мини-гайд
    story: "клип о том, как мёртвый Курсед объясняет, почему враги ещё не закончили игру, а в итоге признаёт: байбеков у них нет"
    title: "держим базу на блефе"
    title_alt: ["психологическая оборона", "блеф уровня бессмертных"]
    desc: "zxcursed / Курсед: главное — чтобы враги не узнали"
    tags: [dota2, zxcursed, курсед, magnus]
    layout: blur
    subs:
      replace:
        кваке: Клоке
    segments:
      - [1132.85, 1143.45]     # хорош на Клоке. но отличие между нами… ты будешь жалеть об этой игре. враги могут закончить… думают, у нас байбеки есть. а у нас нет байбеков

  # МОМЕНТ → РЕАКЦИЯ: ранняя стычка → «насколько я игрок» (в чате Котл: «Хорошо сыграно»)
  - id: 10-igrok
    format: момент → реакция
    story: "клип о том, как после ранней стычки в лесу команда забирает убийство, а в итоге Курсед дважды восхищается собой"
    title: "скромность не входит в билд"
    title_alt: ["сам себя не похвалишь", "самооценка на 8к"]
    desc: "zxcursed / Курсед на Магнусе. насколько он игрок по шкале от 1 до 10?"
    tags: [dota2, zxcursed, курсед, magnus]
    layout: blur
    subs_skip:
      - [308.9, 310.6]        # «выявил, чтобы чел не захилил» — неразборчиво
    segments:
      - [305.0, 312.6]        # стычка → бл*, насколько я игрок, насколько я игрок

  # ЦЕЛЬНЫЙ ОТРЕЗОК: знакомство с хейтером — «я единственный играю… ну не прям единственный» → «ты меня раздражаешь»
  - id: 11-edinstvenny
    format: цельный отрезок с подрезкой
    story: "клип о том, как Курсед удивляется, что Клок не в курсе, что он тут единственный играет, сам же себя поправляет, а в итоге слышит: ты меня раздражаешь"
    title: "единственный, кто играет. почти"
    title_alt: ["самооценка на месте", "скромно, но временно"]
    desc: "zxcursed / Курсед и хейтер на Клоке: так началась эта дружба"
    tags: [dota2, zxcursed, курсед, clockwerk, хейтер]
    layout: blur
    subs:
      replace:
        дотом: доту
        единственно: единственный
    segments:
      - [580.95, 590.1]       # он не в курсе, что я единственный играю доту? ну не прям единственный… не лучшим образом себя показываю, это временно
      - [598.5, 599.9]        # ты меня раздражаешь, какая-то …
      - [606.55, 608.9]       # он мне говорит, что я его раздражаю? или что он сказал?
