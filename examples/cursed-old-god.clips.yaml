# «КАК СТАРЫЙ БОГ КУРСЕДУ РУИНИЛ» (psychokids squad). Одна катка: Курсед (СФ, мид, devil jin)
# в пати со Старым Богом (Пудж, саппорт, ник Legend), который зарейдил его стрим. Итог: 19:41, −26.
# Вебки нет → blur. Голоса: Курсед громкий и яркий, Старый Бог тише и глуше (дискорд).
# who: — только там, где голос определён уверенно (scratchpad voice.py: громкость, тембр, тон).
# 2:52–3:21 — рекламная вставка нарезчика, не трогать.
# v11: короткие клипы v10 объединены в истории 20–40 с (отзыв v10). Прошлый план — clips_v10.yaml.
defaults:
  layouts:
    blur:
      height: 860
  title:
    duration: 3.5
    uppercase: false
    y: 430
  whisper:
    clip_model: large-v3
    language: ru
  subs:
    y: 1530
    who_y: 1438
    replace:
      сэнри: сентри
      сэнтри: сентри
      сэндрю: сентри
      центри: сентри
      старый бог: Старый Бог
      старый бок: Старый Бог
      стрим снайперы: стрим-снайперы
      медас: Мидас
      рэди: ready
      ультуйбрат: "ультуй, брат"
      дазл: Даззл
      въебали: в*бали
      "в*****": в*бали
      "б**": бл*

clips:
  # ЭСКАЛАЦИЯ через всю игру: Пудж-саппорт без денег на детекшн → на 14-й минуте наконец «сентри вь*бал»
  - id: 01-deneg-net
    format: эскалация
    story: >-
      клип о том, как Старый Бог берёт Пуджа на пятёрку, а Курсед всю игру выпрашивает у него
      сентри и дасты; ответ один — «нет денег» (зато капли купил), и в итоге на 14-й минуте
      саппорт гордо сообщает: «я сентри вь*бал, если что»
    title: "денег нет, но вы держитесь"
    title_alt: ["бюджет на детекшн: 0", "саппорт на самоокупаемости"]
    desc: "zxcursed и Старый Бог в одной пати. сколько стоит один сентри — спросите у пятёрки"
    tags: ["#dota2", "#zxcursed", "#курсед", "#старыйбог", "#pudge"]
    layout: blur
    subs:
      replace:
        в центре: сентри
        себя: себе
        достов: дастов
        до 100: дастов
        медик: мидик
        въебал: вь*бал
    subs_skip:
      - [426.4, 426.8]        # «давай» — уже следующая мысль
    segments:
      - {start: 115.8, end: 118.6, who: "Старый Бог · Пудж"}     # а что лучше, есть Пуджика? ну, типа на пятёрку
      - {start: 148.2, end: 151.75, who: "Старый Бог · Пудж"}    # сентри, наверно, в мидик надо?
      - {start: 153.55, end: 154.95, who: "Курсед · СФ"}         # бля, ты не хочешь сам себе сентри купить?
      - {start: 155.75, end: 158.4, who: "Старый Бог · Пудж"}    # да у меня просто нет денег, понял?
      - {start: 161.4, end: 165.2, who: "Курсед · СФ"}          # бля, ну ты не купил сентри вначале?
      - {start: 395.9, end: 399.1, who: "Курсед · СФ"}           # у тебя нет детекшна?
      - {start: 399.1, end: 400.5, who: "Старый Бог · Пудж"}     # да откуда у меня он?
      - {start: 400.6, end: 402.6, who: "Курсед · СФ"}           # ты же покупал сентри!
      - {start: 418.0, end: 419.7, who: "Курсед · СФ"}           # почему у тебя дастов нету?
      - [420.6, 422.4]                                           # ну потому что денег нету
      - {start: 423.95, end: 426.55, who: "Старый Бог · Пудж"}   # нету денег у меня. он даже капли купил себе
      - {start: 868.25, end: 871.0, who: "Старый Бог · Пудж"}    # 14:28 — я сентри вь*бал, я сентри вь*бал, если что

  # ПРОРОЧЕСТВО: «драфт п*здец у них, мы в*бали» → смерть, «ужасно играешь» → «камбэкнем» → «до начала всё понятно»
  - id: 02-prognoz
    format: сетап → развязка (пророчество)
    story: >-
      клип о том, как Старый Бог ещё на драфте объявил «мы в*бали», игра катится вниз (смерть,
      «ты ужасно играешь, как будто пять лет пиво пил»), он пробует «камбэкнем», и в итоге на
      9-й минуте при счёте 3:12 соглашается: «будто бы до начала было всё понятно»
    title: "прогноз сбылся досрочно"
    title_alt: ["пророк из дискорда", "проиграли ещё на драфте"]
    desc: "на драфте сказал — на 9-й минуте подтвердил. zxcursed и Старый Бог"
    tags: ["#dota2", "#zxcursed", "#курсед", "#старыйбог"]
    layout: blur
    subs:
      replace:
        пива: пиво
        уивера: Вивера
    segments:
      - {start: 141.3, end: 143.3, who: "Старый Бог · Пудж"}     # ну, кстати, драфт п*здец у них, мы в*бали (на экране — драфт)
      - {start: 540.6, end: 541.8, subs: false}                  # 9:00 — СФ мёртв, «НВК убил двоих подряд», счёт 3:12
      - [545.1, 547.4]                                             # команда винит не нас ещё. нормально
      - [547.4, 556.0]                                           # ты ужасно играешь, как будто пять лет пиво пил — в смысле? это я ещё нормально играю
      - {start: 581.45, end: 583.7, who: "Старый Бог · Пудж"}    # нормально, камбэкнем. у Вивера Мидас уже есть
      - {start: 587.12, end: 590.31, who: "Курсед · СФ"}          # эта игра была предназначена проиграться, нет как будто?
      - {start: 590.31, end: 592.62, who: "Старый Бог · Пудж"}    # ну да, будто бы до начала было всё понятно

  # ИГРА СТАРОГО БОГА НА ПУДЖЕ: «это мой шанс» (хук + килл) → «не попал» → драка с Реквиемом → чат-колесо «Старый Бог»
  - id: 03-pudge
    format: хайлайт-история
    story: >-
      клип о том, как Пудж Старого Бога кричит «это мой шанс» и хукает Арк Вардена под килл
      Курседа, через 10 секунд мажет по Даззлу, потом Курсед орёт «ультуй, брат!», Реквием в Арене
      Марса забирает драку — и в итоге Старый Бог расписывается чат-колесом «Старый Бог»
    title: "автограф после драки"
    title_alt: ["точность хуков: 50%", "рыбалка с переменным успехом"]
    desc: "zxcursed на СФе, Старый Бог на Пудже. чем закончилась драка — смотри чат"
    tags: ["#dota2", "#pudge", "#старыйбог", "#zxcursed", "#shadowfiend"]
    layout: blur
    subs_skip:
      - [839.2, 840.0]        # модели расходятся: «старый бокс здесь» / «это мой шанс» — не берём
      - [915.15, 921.0]       # «да подожди, мяу», «какой талант берётся…» — мусор и уход в другую тему
    segments:
      - [834.05, 836.2]                                          # у тебя, кстати, хук есть — да е*ать (на экране HUD Пуджа)
      - {start: 836.2, end: 837.75, who: "Курсед · СФ"}          # о, давай, братан, делай
      - {start: 837.75, end: 842.5, who: "Старый Бог · Пудж"}    # да ну нах*й… это мой шанс! (хук 838.3, килл 842)
      - [853.62, 855.75]                                         # не хотим? — можно, можно, если хукнёшь
      - {start: 855.75, end: 856.5, who: "Курсед · СФ"}          # Даззл! Даззл!
      - [856.5, 857.6]                                           # не попал (цепь улетает мимо на 856.4)
      - {start: 910.2, end: 915.2, who: "Курсед · СФ"}           # давай этого чела … ультуй, ультуй, брат! (Арена 15:10)
      - [915.2, 919.0]                                           # Реквием → килфид: три убийства
      - {start: 919.0, end: 920.2, text: "чат-колесо: «Старый Бог»", who: "жмёт Пудж — Старый Бог"}

  # СЖАТАЯ ИСТОРИЯ: «купим блинки — любого убиваем» → оправдания по нарастающей
  - id: 04-versiya
    format: сжатая история (оправдания)
    story: >-
      клип о том, как на 10-й минуте звучит «купишь блинк, я куплю блинк — любого убиваем», а в
      итоге после проигрыша виноваты рейтинг, читы, стрим-снайперы и отсутствие настроения на победу
    title: "официальная версия поражения"
    title_alt: ["блинки есть, настроения нет", "виноваты все, кроме нас"]
    desc: "оправдания Курседа и Старого Бога. какая версия самая убедительная?"
    tags: ["#dota2", "#zxcursed", "#курсед", "#старыйбог"]
    layout: blur
    segments:
      - [643.3, 650.35]                                          # если что, мы эту мапу подвигаем. ты купишь блинк, я куплю блинк — любого убиваем
      - {start: 1084.6, end: 1088.42, who: "Старый Бог · Пудж"}  # стримить же невозможно доту на этом рейтинге
      - [1200.9, 1207.85]                                        # но мы всё равно в*бали — вам не кажется, что они с читами? — нет — они реально всё знают
      - {start: 1211.85, end: 1215.65, who: "Курсед · СФ"}       # так если чё, из-за нас тоже стрим-снайперы — ну да
      - {start: 1218.4, end: 1221.75, who: "Курсед · СФ"}        # главное, чувак, что у нас не было настроения на победу, понял?

  # КАДР-РЕЗУЛЬТАТ: рейд → последний бой → враги в чате — фанаты Старого Бога → «минус 26»
  - id: 05-fan-vstrecha
    format: кадр-результат
    story: >-
      клип о том, как Курсед благодарит Старого Бога за рейд, в последнем бою Старый Бог зовёт
      тиммейта на помощь, а враги оказываются его фанатами: «передаю привет братве», «старый бог
      лучший», «хорошо сыграно» — и в итоге снимают с Курседа 26
    title: "фан-встреча прошла успешно"
    title_alt: ["привет братве от соперников", "фанаты не подвели"]
    desc: "zxcursed и Старый Бог. баннер в конце — отдельный вид искусства"
    tags: ["#dota2", "#zxcursed", "#старыйбог", "#курсед"]
    layout: blur
    subs:
      replace:
        вива: Weaver
        вивере: Вивере
    subs_skip:
      - [1307.5, 1307.84]     # «так» — мусор распознавания
      - [1309.95, 1310.5]     # «ну» — начало следующей фразы
    segments:
      - {start: 13.45, end: 15.5, who: "Курсед"}                                    # спасибо за рейд, Старый Бог — пожалуйста
      - {start: 130.6, end: 132.8, subs: false, zoom: 1.6, focus: [0.5, 0.8]}     # «stariy_bog рейдит канал с 17852 зрителями!»
      - [1272.1, 1277.95]                                                           # последний бой: блинк! есть! Вива, can you come please? one fight? — не, он в тильте жёстко на Вивере
      - {start: 1295.6, end: 1305.3, subs: false, zoom: 1.8, focus: [0.42, 0.7]}   # чат врагов: «Heeeelp me pleeease», привет братве, старый бог лучший, хорошо сыграно
      - {start: 1305.3, end: 1307.9, subs: false}                                   # «aureole уже ПРЕВОСХОДИТ БОГОВ», «Вы мертвы»
      - [1307.8, 1310.0]                                                            # сколько сняло? — минус 26
