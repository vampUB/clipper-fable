# «КУРСЕД НА СФЕ ПРОТАЩИЛ ЯТОРО ПЕРЕД ИНТОМ?» (Zxcursed Rofls, 21:56). Одна катка:
# Курсед (necrofantasia, СФ мид) в пати с Яторо (Сларк; Курсед зовёт его «король», «лучший друг»).
# Итог: победа сил Света 47:24, Курсед 19/1/11, Яторо 17/3/15. Враги: Инвокер (angel) на миде,
# Бэйн (deihra, 4/13/10) сделал ФБ на Яторо в 3:14, Dawnbreaker («Время в никуда») — стример с вебкой,
# это Limitless: в повторе на его экране над Dawnbreaker подписано «Limitless» (21:05). Инвокер — Adlet Meyer.
# POV: Курсед без вебки (blur); вставки вражеского стримера — вебка внизу слева (stream).
# 3:24.4–4:05 — рекламная вставка нарезчика, не трогать. 0:00–0:28 — холодное открытие канала.
# Голоса: Курсед громкий (~−27 дБ), Яторо в дискорде тихий (~−37 дБ) — scratchpad voice.py.
# Точная модель на окнах клипа теряет тихий голос Яторо и речь под шумом игры — там, где так,
# whisper.clip_model: null (общий транскрипт, тоже large-v3). Спорные места сверены отдельным
# прогоном коротких окон без VAD (scratchpad asr.py).
defaults:
  layouts:
    blur:
      height: 860
    stream:
      cam: [0.088, 0.795, 0.205, 0.205]
      top_height: 760
      game_focus_x: 0.55
  title:
    duration: 3.5
    uppercase: false
    y: 430
  whisper:
    clip_model: large-v3
    language: ru
  subs:
    y: 1530
    who_y: 1438
    replace:
      етора: Яторо
      хитора: Яторо
      фларк: Сларк
      фарк: Сларк
      воет: Войд
      войт: Войд
      нвокера: Инвокера
      инвокер: Инвокер
      инвокера: Инвокера
      sf: СФ

