# «КУРСЕД НА СФЕ ПРОТАЩИЛ ЯТОРО ПЕРЕД ИНТОМ?» (Zxcursed Rofls, 21:56). Одна катка:
# Курсед (necrofantasia, СФ мид) в пати с Яторо (Сларк; Курсед зовёт его «король», «лучший друг»).
# Итог: победа сил Света 47:24, Курсед 19/1/11, Яторо 17/3/15. Враги: Инвокер (angel) на миде,
# Бэйн (deihra) сделал ФБ на Яторо в 3:14, Dawnbreaker («Время в никуда») — стример с вебкой,
# по названию ролика это Limitless (в клипах подписан «стример врагов» — имя не проверено).
# POV: Курсед без вебки (blur); вставки вражеского стримера — вебка внизу слева (stream).
# 3:24.4–4:05 — рекламная вставка нарезчика, не трогать. 0:00–0:28 — холодное открытие канала.
# Голоса: Курсед громкий (~−27 дБ), Яторо в дискорде тихий (~−37 дБ) — scratchpad voice.py.
# Точная модель на окнах клипа теряет тихий голос Яторо и речь под шумом игры — там, где так,
# whisper.clip_model: null (общий транскрипт, тоже large-v3). Спорные места сверены отдельным
# прогоном коротких окон без VAD (scratchpad asr.py).
defaults:
  layouts:
    blur:
      height: 860
    stream:
      cam: [0.088, 0.795, 0.205, 0.205]
      top_height: 760
      game_focus_x: 0.55
  title:
    duration: 3.5
    uppercase: false
    y: 430
  whisper:
    clip_model: large-v3
    language: ru
  subs:
    y: 1530
    who_y: 1438
    replace:
      етора: Яторо
      хитора: Яторо
      фларк: Сларк
      фарк: Сларк
      воет: Войд
      войт: Войд
      нвокера: Инвокера
      инвокер: Инвокер
      инвокера: Инвокера
      sf: СФ

clips:
  # СЕТАП → РАЗВЯЗКА: волнение перед игрой с лучшим другом → 19-1-11 → «мне нужны шорты»
  - id: 01-ruki-vspoteli
    format: сетап → развязка
    story: >-
      клип о том, как Курсед перед игрой с Яторо нервничает — «руки вспотели», «я не опозорюсь,
      парни», ведь однажды он уже зарунил ему катку на Пудже за игру до 15 тысяч, — а в итоге
      читает своё табло «19-1-11» и требует шортсы
    title: "руки потели. смертей: 1"
    title_alt: ["волнение перед королём", "главное — не опозориться"]
    desc: "zxcursed в пати с Yatoro. а у тебя руки потеют перед игрой с другом?"
    tags: ["#dota2", "#zxcursed", "#курсед", "#yatoro", "#shadowfiend"]
    layout: blur
    whisper: {clip_model: null}       # окно клипа теряет фразы 2:52–3:03
    subs:
      replace:
        "1 града и": "одна игра до"
        "1 града": "одна игра до"
        нетворца: нетворса
        гпма: ГПМ
    segments:
      - [150.05, 153.4]     # ну, это мой вот лучший друг. у него такие вот победы, поражения
      - [157.75, 158.55]    # у меня руки вспотели
      - [172.15, 175.9]     # я не опозорюсь, я не опозорюсь, парни. я нормально, я нормально, парни
      - [176.1, 183.45]     # после того как я ему в дискорде на пудже руинил катку… хуже не будет, поверьте
      - [1235.6, 1238.05]   # табло: 37 тысяч нетворса, 19-1-11
      - [1246.4, 1249.55]   # я… мне нужны шорты

  # МОМЕНТ → РЕАКЦИЯ ВРАГА: «превосходит богов» → вражеский стример: «СФ бустер, урод»
  - id: 02-sf-buster
    format: момент → реакция (враг)
    story: >-
      клип о том, как Курсед в драке получает баннер «превосходит богов» («они не знали, что у меня
      БКБ»), а вражеский стример в итоге решает, что СФ — бустер, и разносит своего Инвокера:
      «у тебя соло-линия!»
    title: "превзошёл богов — значит, бустер"
    title_alt: ["приняли за бустера", "19-1? значит, бустер"]
    desc: "zxcursed на СФе против Инвокера. на миде соло-линия, если что"
    tags: ["#dota2", "#zxcursed", "#курсед", "#shadowfiend", "#invoker"]
    layout: blur
    subs:
      replace:
        орлот: урод
    subs_skip:
      - [762.8, 763.6]      # «ФП, SF» — неразборчиво, модели расходятся
    segments:
      - [739.0, 747.5]      # 12:19 «necrofantasia уже ПРЕВОСХОДИТ БОГОВ» → они не знали, что у меня БКБ…
      - {start: 747.8, end: 751.4, layout: stream, who: "стример врагов · Dawnbreaker"}  # СФ-бустер, урод. лови монетку, Инвокер
      - {start: 759.85, end: 768.15, layout: stream}   # тебя два раза один на один е*нули… у тебя соло-линия

  # СЖАТАЯ ИСТОРИЯ: драфт для короля → «король пал» → гонка фрагов → «17, боже, чел!»
  - id: 03-korol
    format: сжатая история
    story: >-
      клип о том, как Курсед подбирает Яторо героя и уговаривает его со «всё, играем, Фурион» на
      Сларка, на третьей минуте Яторо отдаёт первую кровь — «это конец, король пал», потом Курсед
      делит с «лучшим другом» пачки и затевает гонку фрагов, а в итоге Яторо «превосходит богов»
      и Курсед после игры: «сколько у него? 17, боже, чел!»
    title: "дружба дружбой, а фраги врозь"
    title_alt: ["личный драфтер короля", "король пал. ненадолго"]
    desc: "zxcursed подобрал Yatoro героя и устроил с ним гонку фрагов. итог 19:17 — угадай, в чью пользу"
    tags: ["#dota2", "#yatoro", "#zxcursed", "#slark", "#курсед"]
    layout: blur
    whisper: {clip_model: null}       # large-v3 на окне клипа теряет тихий голос Яторо
    subs:
      replace:
        саламикаточку: "сам каточку"
        "кого -то в кило": "у кого киллов"
        "кого -то киллов": "у кого киллов"
    segments:
      - {start: 115.3, end: 119.15, who: "Курсед · СФ"}  # класс пик для короля. пусть думает, пусть сам каточку выиграет
      - [119.2, 125.45]                                # дровка? спектру? Войд — вообще идеальный выбор
      - [125.5, 127.1]                                 # давай. ну Фурион тоже хорош
      - {start: 131.1, end: 133.7, who: "Яторо"}        # ну Фурион хорош. Фурион хорош
      - [135.75, 139.45]                               # Фурион нормальный… Фурион. всё, играем
      - {start: 139.5, end: 142.25, who: "Курсед · СФ"} # а ну вообще Сларк как будто идеально тут
      - {start: 142.3, end: 144.08, who: "Яторо"}       # да, Сларк мне тоже по душе
      - {start: 193.55, end: 196.15, who: "Курсед · СФ"}  # ФБ Бэйна на Яторо — а, это конец. король пал
      - [809.75, 813.76]                               # вкусная пачка мне принадлежит, ещё либо моему другу, если он захочет
      - [1014.75, 1016.5]                              # мы с моим лучшим другом не проиграем
      - [1111.4, 1113.45]                              # мы будем качать им голову или нет?
      - [1114.55, 1115.65]                             # или мы не можем?
      - [1132.1, 1134.1]                               # а дайте кому-то в голову ударить
      - [1134.8, 1138.1]                               # мы соревнуемся со Сларком, у кого киллов больше?
      - [1158.3, 1161.68]                              # «Yatoro уже ПРЕВОСХОДИТ БОГОВ» — у него 17, он гоняет меня
      - [1207.3, 1209.85]                              # сколько у него? 17, боже, чел!

  # СКВОЗНАЯ НИТКА: вражеский Бэйн весь матч
  - id: 04-bane
    format: суперкат (сквозная нитка)
    story: >-
      клип о том, как вражеский Бэйн делает ФБ на Яторо, потом ловит Курседа в ульт («как мне
      за*бал этот Бэйн»), и в итоге Курсед, у которого в пати Яторо, завидует врагам: «почему за
      меня нет такого Бэйна, который идеально играет?»
    title: "в пати яторо, завидует бэйну"
    title_alt: ["бэйн, которого мы не заслужили", "главный фанат вражеского бэйна"]
    desc: "zxcursed vs Бэйн. а за тебя когда-нибудь играл такой саппорт?"
    tags: ["#dota2", "#zxcursed", "#курсед", "#bane"]
    layout: blur
    whisper: {clip_model: null}
    subs:
      replace:
        выиграть: "почему выиграть"   # «почему» на 871.6 — сверено коротким окном, в общем транскрипте съехало
        за: "почему за"               # «почему» на 895.7 — то же
        бейт: Бэйн
        бэйт: Бэйн
        заебататат: за*бал
        заебатат: за*бал
        "е*аного": ""
        ебаного: ""
    segments:
      - [201.7, 204.3]      # а кто фб сделал? — баня
      - [871.4, 874.5]      # почему выиграть так тяжело? я не понимаю
      - [1139.5, 1146.9]    # СФ ныряет в драку, ульт Бэйна (19:02–19:06): та я е*ал! ну! ну? ну?
      - [1148.6, 1151.2]    # как мне за*бал этот Бэйн
      - [883.85, 885.65]    # та я е*ал, нафиг!
      - [895.5, 897.3]      # почему за меня нет такого Бэйна?
      - [898.8, 900.12]     # который идеально играет

  # ДРУГАЯ СТОРОНА: вражеская команда по ходу игры
  - id: 05-stadii
    format: эскалация (вид с той стороны)
    story: >-
      клип о том, как враги узнают, что против них Яторо («думаю, это азиатский ранг»), потом их
      стример по ходу игры «заплачу, ну что это такое», «как выиграть эту е*аную доту», и в итоге
      враги признают «всё было на пятой минуте» и винят Инвокера — «он сам умер»
    title: "стадии принятия с той стороны"
    title_alt: ["тем временем у врагов", "отрицание: азиатский ранг"]
    desc: "zxcursed и Yatoro глазами врагов. на какой минуте понял бы ты?"
    tags: ["#dota2", "#zxcursed", "#yatoro", "#курсед"]
    layout: stream
    subs:
      replace:
        "выиграть за": "выиграть эту"
        "5 минут": "пятой минуте"
        "в ёпу": "в ж*пу"
        "в епу": "в ж*пу"
    segments:
      - {start: 161.1, end: 163.45, who: "вражеская команда"}     # против Яторо, думаешь, с победами? это Яторо?
      - [165.65, 167.6]     # ты уверен? я думаю, это азиатский ранг
      # реплики стримера по ходу игры — из холодного открытия канала (там его вебка во весь кадр;
      # те же фразы есть во вставках 9:43 и 11:42, но лицо там крошечное)
      - {start: 4.0, end: 8.1, layout: blur, who: "стример врагов · Dawnbreaker"}  # щас, бл*, заплачу. ну что это, бл*, такое?
      - [701.6, 704.1]      # (вставка 11:42) это как выиграть эту е*аную доту?
      - {start: 1012.15, end: 1014.6, who: "вражеская команда"}   # по-моему, очевидно, всё было на пятой минуте ещё
      - [1302.15, 1307.62]   # тем более когда у него ласт пик. вторая смерть — п*здец. типа он сам умер

  # ХАЙЛАЙТ: «ранжа не хочешь, пупсик?» → килл → «рунку бы» → торнадо → серия → «у меня мид упал?»
  - id: 06-pupsik
    format: хайлайт с реакцией
    story: >-
      клип о том, как Курсед сюсюкает с врагом «хочешь, маленький? иди сюда, пупсик» и убивает его,
      жалуется, что ему не контролят руны, ругается на торнадо Инвокера и делает серию убийств, а в
      итоге вражеский стример спрашивает: «у меня мид упал, да?»
    title: "ласковый мидер"
    title_alt: ["иди сюда, пупсик", "мидер с плохим настроением"]
    desc: "zxcursed на миду: сначала ласково, потом рейзами"
    tags: ["#dota2", "#zxcursed", "#курсед", "#shadowfiend"]
    layout: blur
    whisper: {clip_model: null}
    subs:
      replace:
        "меня мид упал": "у меня мид упал"
    subs_skip:
      - [486.3, 489.1]      # «ты е*ался у» — мусор распознавания, на экране баннер серии
      - [451.7, 453.1]      # «ха, сукин сын» / «супер сын» — модели расходятся
    segments:
      - [444.3, 445.05]     # ранжа не хочешь?
      - [447.15, 453.1]     # хочешь, маленький? конечно ты хочешь ранжа! иди сюда! пупсик (килл 7:29)
      - [454.9, 459.4]      # ну вот бы мне кто-то рунку законтролил, у меня бы всё прикольно было
      - [479.7, 483.5]      # какой он о*уенный торнадо дал? это чтоб меня тауэр начал бить под пулснэпом
      - [486.3, 489.1]      # 8:07.6 «necrofantasia совершает серию убийств»
      - {start: 490.4, end: 492.8, layout: stream, who: "стример врагов · Dawnbreaker"}   # у меня мид упал, да?

  # ОФФТОП / НЫТЬЁ: игру с Яторо никак не могут начать
  - id: 07-lobby
    format: нытьё (оффтоп)
    story: >-
      клип о том, как Курсед собирается «с братиком выиграть каточку», но игра не грузится —
      «это единственная нормальная игра будет», лобби пропадает («я потерян»), он сидит и ждёт, и в
      итоге находится драфт, где Яторо выбирает игроков: «Боже, да, давай!»
    title: "загрузка сложнее самой игры"
    title_alt: ["единственная нормальная игра", "посидим, посидим, посидим"]
    desc: "zxcursed ждёт игру с Yatoro. сколько ты бы прождал?"
    tags: ["#dota2", "#zxcursed", "#курсед", "#yatoro"]
    layout: blur
    whisper: {clip_model: null}
    subs:
      replace:
        но: ну
        неет: нееет
        лесно: ""
        хах: ""
        haben: ""
    segments:
      - [29.0, 35.6]        # ну вот, мой кент. сейчас с братиком выиграем каточку. ну, если ребята вгрузятся в игру, которой уже 50 лет
      - [39.75, 44.45]       # ну неет, ну как? ну пожалуйста. ну это единственная игра нормальная будет
      - [48.95, 53.45]       # да как это возможно? всё, я потерян, теперь не будет того лобби ещё
      - [83.62, 86.55]       # окей, посидим, посидим, посидим, посидим
      - [99.6, 101.7]       # драфт капитанов на экране — боже, да, давай!
