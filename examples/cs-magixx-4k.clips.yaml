      - {start: "52:17.8", end: "52:20.85", video_at: "19:56.0", layout: blur, layouts: {blur: {height: 1100}}}   # так всё легко было, п*здец потом начался (12:12)
      - ["52:20.85", "52:25.55"]    # возможно, это потому, что я сказал, что он легко идёт. ах*енно легко идёт, бл*
      - {start: "52:27.25", end: "52:29.4", video_at: "51:30.0"}   # легко идёт, 28-25

