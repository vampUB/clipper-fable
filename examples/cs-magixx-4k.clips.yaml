# «КАК MAGIXX и SKYWHYWALKER ИГРАЛИ САМУЮ ДОЛГУЮ и СЛОЖНУЮ ИГРУ НА 4K ELO» (MAGIXX CHILL, 52:56).
# CS2, FACEIT, Mirage. Стрим magixxlff 02.12.2025. Одна катка 28:25 после 4 овертаймов.
# Команда Magixx (team_MadLife516): mUZBEKISTANm = Magixx (Борис), CR7M3N7ALI7Y = Тимур (skywhywalker),
#   MadLife516, -Uzn1k- («Узник»), Hukah («Хука»). Голосом ещё «Стас» (кто из ников — не ясно).
# Враги (team_olofmeister): в лобби FACEIT olofmeister, f0rest, friberg, chappa-_-, fakesup;
#   в игре ники Upugek, Apogif, Adoro, chappa-_-, fakesup.
# Вставки нарезчика — не брать: 0:00–0:12 холодное открытие, 3:55–4:12 реклама, 4:45–5:05 мем
#   с камерой, 5:15–6:17 кино-повтор, 22:41–23:45 повтор клатча Apogif (под музыкой),
#   зумы вебки 9:44, 48:53, 52:35, 52:50 «подпишись». Лобби 0:14.6–0:20.7 — зум нарезчика, его берём.
# Счёт: 10:2 к перерыву (10:30), 12:11 матчбол → 12:12 (19:54), ОТ1 враги 15:12 (23:52),
#   эйс Magixx на 13:15 (26:46–27:18) → 15:15, ОТ3 → 24:24, ОТ4 → 28:25 (VICTORY 51:26).
defaults:
  layouts:
    stream:
      cam: [0.0, 0.49, 0.185, 0.248]
      top_height: 700
    crop:
      rect: [0.665, 0.04, 0.305, 0.96]   # лобби FACEIT: колонка шведов
  title:
    duration: 3.5
    uppercase: false
    label_y: 1350                       # надписи text: ниже субтитров (в stream субтитры ~930)
  whisper:
    clip_model: large-v3
    language: ru
  subs:
    replace:
      олофмейстер: Олофмейстер
      олафмейстер: Олофмейстер
      олаф: Олаф
      олафа: Олафа
      форест: Форест
      фрайберг: Фрайберг
      гетрайт: Гетрайт
      тимур: Тимур
      борис: Борис
      магикс: Мэджикс

clips:
  - id: 01-shvedy
    format: сетап → развязка
    story: >-
      клип о том, как Magixx видит в лобби шведских легенд (olofmeister, friberg, f0rest),
      решает «Олафа не пикать, а крысить» и требует собрать ебальники, и в итоге через
      4 овертайма они выигрывают 28:25
    title: "шведские легенды в лобби"
    title_alt: ["олофмейстера решили не пикать", "magixx попался на шведских легенд"]
    desc: "Magixx / Мэджикс и skywhywalker против olofmeister, f0rest и friberg. а ты бы стал пикать олофа?"
    tags: ["#cs2", "#кс2", "#magixx", "#olofmeister", "#faceit"]
    layout: stream
    subs:
      replace:
        "олаф мейстер": Олофмейстер
        офмейстер: Олофмейстер
        гитрайт: Гетрайт
        cs: КС
        "на сделал": нахуй
        хуе: хуя
    segments:
      - {start: "0:17.0", end: "0:19.07", layout: crop}                  # подожди, это какие-то еб*ные задроты
      - {start: "0:19.07", end: "0:24.02", layout: crop, video_at: "0:15.0"} # это, наверное, шведы типа Гетрайт, Форест, не?
      - ["0:25.05", "0:27.58"]      # Олофмейстер, Фрайберг, Форест, походу реально они
      - ["0:28.5", "0:30.2"]        # ни х*я себе
      - ["0:34.42", "0:39.1"]       # у них два самых крутых пацана в КС. бл*, давайте выиграем, пожалуйста
      - ["0:59.35", "1:06.1"]        # я не буду его пикать, это Олофмейстер… буду в бок его еб*шить
      - ["1:17.3", "1:22.85"]       # здорово, пацаки, соберите еб*льники, и мы её выиграем. хорошо?
      - {start: "51:20.6", end: "51:29.0", text: "4 овертайма спустя"}    # да кто поверит, сделано + VICTORY 28-25

