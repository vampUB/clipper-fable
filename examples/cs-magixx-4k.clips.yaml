    title_alt: ["эйс на матчболе от шведов", "magixx не дал шведам закрыть"]
    desc: "Magixx / Мэджикс, эйс с AWP на 13 хп при 13:15 в овертайме против olofmeister и f0rest. сколько раз пересмотрел?"
    tags: ["#cs2", "#кс2", "#magixx", "#ace", "#awp"]
    layout: stream
    whisper: {clip_model: null}   # окна large-v3 путают «давайте раунды брать»
    subs:
      replace:
        "ебалось катя": "е*алась катя"
        ебалось: е*алось
        барис: Борис
    segments:
      - {start: "23:48.3", end: "23:51.1", video_at: "23:51.6", text: "у шведов матчбол"}   # ах*еть, бл*, нах*й такое
      - {start: "24:04.95", end: "24:08.2", video_at: "23:56.5"}   # е*алась катя, вот что я могу сказать (табло 15:12)
      - ["24:08.2", "24:13.0"]      # это вообще п*здец. ладно, пох*й, давайте раунды брать
      - {start: "26:46.0", end: "27:04.5", text: "13:15, снова матчбол"}   # AWP: fakesup, chappa, Adoro, Upugek
      - ["27:10.0", "27:18.6"]      # ищет последнего — Apogif
      - {start: "27:18.6", end: "27:23.4", who: "тиммейт",
         inset: {rect: [0.285, 0.035, 0.25, 0.14], width: 760, at: [540, 1250]}}   # Борис, это как такое возможно? (5 черепов, 13 хп)

