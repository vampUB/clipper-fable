    format: хайлайт (сетап → развязка)
    story: >-
      клип о том, как шведы выигрывают клатч и встают на матчбол в овертайме, Magixx ругается
      и говорит «давайте раунды брать», а в итоге сам на AWP с 13 хп делает эйс на матчболе,
      и тиммейт спрашивает «Борис, это как такое возможно?»
