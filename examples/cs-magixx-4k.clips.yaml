    story: >-
      клип о том, как при счёте 10:2 Magixx просит «сделать потную», команда сливает всё до 12:12,
      он орёт на АФК в КТ, и в итоге объявляет овертайм своим планом: «чтобы интересно было, чтобы
      обиднее было им» — и уточняет, что их «ебёт» Олаф с нулевым пингом
    title: "10:2 это слишком скучно"
    title_alt: ["magixx сделал потную", "овертайм по плану"]
    desc: "Magixx / Мэджикс: вели 10:2 у шведов. как думаешь, кому в итоге было обиднее?"
    tags: ["#cs2", "#кс2", "#magixx", "#olofmeister", "#faceit"]
    layout: stream
    segments:
      - {start: "10:44.65", end: "10:47.35", video_at: "10:29.3", layout: blur, text: "10:2 к перерыву", layouts: {blur: {height: 1100}}}  # пацаки, давайте всё-таки потную сделаем
      - ["19:37.3", "19:45.6"]      # тикет, чел, тикет! …человек, ты просто АФК стоишь
      - ["19:54.15", "20:01.6"]       # всё, парни, ладно, так и быть, возвращаемся к той самой… чтобы обиднее было им

