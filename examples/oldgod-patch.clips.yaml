# Старый Бог (Io, ник Legend) — лобби капитанов в патче 7.42: Satanic капитан, в команде Noone
# («Вова», «Нунчик»), Pure, Koma. Против: Панголин (zavjia), Марс, Зевс («Зюзя»), ДК, Никс.
# Итог: «Победа сил Света» 40:22 — команда Старого Бога выиграла.
# Ролик уже смонтирован монтажёром Старого Бога: зумы на вебку на весь экран (там layout: blur),
# реклама 2:22–3:05 и 10:43–11:08 — не брать.
# Субтитры — из автосубтитров YouTube (transcript.json): large-v3 на этом ролике теряет реплики
# тиммейтов из дискорда. Мат YouTube вырезает из автосубтитров — в субтитрах его нет.
# Голоса: Старый Бог громкий (−12…−19 dB), Satanic из войса тише (−23…−31 dB) + плашка войса.
defaults:
  layouts:
    stream:
      cam: [0.79, 0.0, 0.21, 0.265]
      top_height: 700
      game_focus_x: 0.5
    blur:
      height: 860
  whisper:
    clip_model: null
  subs:
    replace:
      висп: Висп
      виспа: Виспа
      веспа: Виспа
      веспе: Виспе
      нун: Нун
      навана: Нуна
      нувана: Нуна
      нучик: Нунчик
      бкб: БКБ
      бкбшечка: БКБшечка
      "старый бух": "Старый Бог"
      "старый бог": "Старый Бог"
      "старый боб": "Старый Боб"
      пела: ПЛа
      ястрбы: ястребы
      морш: морж
      мангалера: Панголина

clips:
  - id: 01-nun-v-mute
    format: цельный отрезок с подрезкой (самоирония)
    story: "клип о том, как Старый Бог жалуется, что Вова (Нун) за всю игру ни слова не сказал в микрофон, и в итоге сам находит у себя Нуна в муте"
    title: "почему нун молчит всю игру"
    title_alt: ["старый бог сам замутил нуна", "вове не хватает порядочности"]
    desc: "Старый Бог / stariy_bog на Виспе в патче 7.42. проверь свой мут лист прямо сейчас"
    tags: [dota2, старыйбог, stariybog, noone, io]
    layout: stream
    subs:
      replace:
        "она у меня": "он у меня"
    subs_skip:
      - ["9:08.90", "9:10.60"]
      - ["9:14.10", "9:15.70"]
    segments:
      - ["8:45.56", "8:51.37"]
      - ["9:03.15", "9:22.01"]

  - id: 02-vetka
    format: сетап → развязка (мини-гайд)
    story: "клип о том, как Старый Бог проиграл на Виспе со счётом 18/2/16, объявил, что секрет в том, чтобы покупать четыре ветки вместо пяти, и в итоге через 10 минут хвастается БКБ на 14-й минуте благодаря этой ветке"
    title: "секрет старого бога в одной ветке"
    title_alt: ["лайфхак от старого бога", "минус ветка плюс бкб"]
    desc: "Старый Бог / stariy_bog: четыре ветки или пять? пиши свой вариант"
