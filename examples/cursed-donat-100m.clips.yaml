# «ZXCURSED'у ЗАДОНАТИЛИ 100.000.000 МИЛЛИОНОВ РУБЛЕЙ?! (ну ваще почти)» (нарезчик rewesize, стрим 23.11.26, 16:58).
# Одна катка: Курсед (ник «привет») — СФ мид против Пака (bored). Пак ставит паузы «залагало», потом
# бегает на СФа и умирает — Курсед весь матч клянётся, что «это не мой агент». После игры донат-виджет
# «сломался», потом алерт «мелстрой — 100 000 000 RUB! крутой стрим» (15:50–16:14) — сумма с ника,
# реальность доната не утверждаем. Вебки нет → blur.
defaults:
  layouts:
    blur:
      height: 860
  title:
    duration: 3.5
    uppercase: false
    y: 430
  whisper:
    clip_model: large-v3
    language: ru
  subs:
    y: 1530
    who_y: 1438
    replace:
      пака: Пака
      паке: Паке
      мидер: мидер
      "Мидер-Потный": "мидер потный"
      ламаргиний: Ламборгини
      ламаргинни: Ламборгини
      фирарий: Феррари
      фирарии: Феррари
      маклари: Макларен
      гелентваген: Гелендваген

clips:
  # МОМЕНТ → РЕАКЦИЯ (с поводом): «виджет сломался» → «сработало, я ещё ничего не жал» → «мелстрой — 100 000 000 RUB»
  - id: 01-100mln
    format: момент → реакция
    story: >-
      клип о том, как у Курседа после игры не работает донат-виджет, он его чинит, виджет
      оживает сам, и в итоге на экран падает «мелстрой — 100 000 000 RUB», а Курсед уже выбирает
      между Ламборгини и Феррари
    title: "виджет починили удачно"
    title_alt: ["курсед выбирает ламбу", "100 миллионов на стриме"]
    desc: "zxcursed и донат на 100 миллионов. на что бы ты потратил?"
    tags: ["#dota2", "#zxcursed", "#курсед", "#донат"]
    layout: blur
    whisper: {clip_model: null}       # large-v3 на крике под музыку алерта галлюцинирует («Субтитры сделал…»)
    subs_skip:
      - [948.7, 950.3]                # «о, я не …» — неразборчиво
      - [960.3, 964.1]                # «ты чё, …?» — модели слышат по-разному
    subs:
      replace:
        болстать: "Мелстрой,"
        бануна: "да ну нах*й"
        "я не пол": "я е*ал"
        писта: п*здец
        кудо: куда
        ли: или
        барни: парни
        веебать: в*бать
        бляй: бл*
        "бляй, дай": "бл*, да я"
        мерседе: Мерседес
        еб: ё
        "бага наработает": "баганно работает"
    segments:
      - [888.55, 893.35]        # не работают донаты вообще, что за х*йня? виджет сломался
      - [936.2, 941.0]          # смотрите, сработало… баганно работает. я ещё ни х*я не жал
      - {start: 947.0, end: 964.1,                         # ай, бл*, сука! … 100 миллионов! … ты чё?
         inset: {rect: [0.40, 0.795, 0.20, 0.07], width: 960, at: [540, 260], from: 3.0}}
      - {start: 966.3, end: 978.6,                         # куда потратить? Ламборгини или Феррари покупать, парни? спасибо!
         inset: {rect: [0.40, 0.795, 0.20, 0.07], width: 960, at: [540, 260], to: 7.6}}
      - [983.0, 999.4]          # куда эти бабки в*бать? куплю дом, яхту, машины… 100 миллионов — не деньги, деньги

  # СЖАТАЯ ИСТОРИЯ: Пак сам бежит умирать → «я лифт не заказывал» → «это не мой агент» → «может, актёр, но не мой» → «никто не узнает»
  - id: 02-ne-moy-agent
    format: сжатая история
    story: >-
      клип о том, как вражеский Пак раз за разом сам прибегает умирать к СФу, Курсед клянётся
      чату, что лифт не заказывал и «это не мой агент», придумывает версии про подписчика и актёра,
      а в итоге после игры подытоживает: чел сдался или вливал, никто не знает и никто не узнает
    title: "курсед лифт не заказывал"
    title_alt: ["это не мой агент", "клянусь, не мой"]
    desc: "zxcursed против Пака. веришь, что не его агент?"
    tags: ["#dota2", "#zxcursed", "#курсед", "#shadowfiend", "#puck"]
    layout: blur
    subs:
      replace:
        обливает: вливает
        хрюконе: х*йне
        клюнусь: клянусь
        полюбом: по-любому
        "с блядом": ""
        беспалено: беспалевно
        Деверят: верят
        влевал: вливал
        напаке: на Паке
        соблюдал: ""
        полевого: по-любому
        "пою бы": проё*ываю
        беспален: беспалевно
        "оба сделала": сделал
        "на парня": "но, парни,"
        вид: "видит,"
    segments:
      - [522.2, 526.7]          # давай, братан, делай. что, вливает? ну я в лифт не заказывал, честно
      - [532.85, 538.7]         # клянусь, я не заказывал ничего. это не мой агент, это не мой агент
      - [544.6, 552.45]         # я честно, парни, я вам когда-то врал в жизни своей?… это не мой агент
      - [558.3, 564.05]         # он по-любому вливает, но, парни, не мне вливает, клянусь
      - [567.9, 576.3]          # вдруг это подписчик решил мне ММР дать… хотя бы беспалевно, люди же верят
      - [685.6, 698.85]         # это может быть актёр… но это не мой. если бы был мой — я бы признался… не покупал, не трогал ничего
      - [844.8, 858.1]          # 29? эта игра такая себе была. чел сдался на Паке, ну или вливал… никто не знает и никто не узнает

  # МИНИ-ГАЙД → ПРОВАЛ → «ВЫСУШИЛ В НОЛЬ»: «не дадим задинаить ни одного крипа» → «он ренджа вдинаил» → «высушил мид в ноль»
  - id: 03-mid-v-nol
    format: мини-гайд → провал
    story: >-
      клип о том, как Курсед объясняет, что на этом рейтинге можно отдыхать и что вражескому
      мидеру он не даст задинаить ни одного крипа, тут же получает денай рейнджа («ничего
      страшного, мы удовольствие получать пришли»), а в итоге, пока Пак ставит паузы «залагало»,
      объявляет, что высушил мид в ноль и поднял мораль команды
    title: "курсед объясняет мид"
    title_alt: ["денай по плану", "высушил мид в ноль"]
    desc: "zxcursed на СФе против Пака. одного крипа отдать можно, это временно"
    tags: ["#dota2", "#zxcursed", "#курсед", "#shadowfiend", "#puck"]
    layout: blur
    subs:
      replace:
        "ПАК Айтам": "Пака иду там"
        крепчиков: крипчиков
        келлы: койлы
        прохрашиваем: прохаркиваем
        задинать: задинаить
        "в динайл мне": "вдинаил мне"
        удольцы: удовольствие
        "уже курвать": "жопу рвать"
        залагала: залагало
        "долбо -йоба": долбо*ба
        понял: поднял
        начали: "на чиле"
        "к выигрывается": "каточка выигрывается"
        заднего: "с дальнего"
        прокрашиваем: прохаркиваем
        рэнджа: рейнджа
        рнжа: рейнджа
        задинайить: задинаить
        кайлы: койлы
        кейлы: койлы
        "в дина у меня": "вдинаил мне"
        "и ренджа": ренджа
        понимание: "правильно? а не"
        "в 0": "в ноль"
    segments:
      - [126.8, 130.8]          # вот на этом рейтинге, ребята, можно именно кайф лутать
      - [133.15, 137.0]         # я на чиле буду просто, я не буду даже жопу рвать
      - [141.0, 144.15]         # койлы влево-вправо, ну и всё, каточка выигрывается
      - [144.15, 150.75]         # начинаем, как обычно, с дальнего койла… добиваем двух крипов сразу же
      - [151.4, 162.1]          # не даём вражескому мидеру задинаить ни одного крипа… одного можно позволить… но это временно
      - [186.25, 191.5]         # ой, бл*, вот это… ой, бл*… он ренджа вдинаил мне
      - [191.8, 196.95]         # ничего страшного. мы же удовольствие пришли сюда получать, правильно? а не жопу рвать
      - [301.2, 303.7]          # типа залагало, типа залагало (Пак ставит паузу)
      - {start: 314.2, end: 325.0,                         # главное, чтобы команда верила, что у них мидер потный… высушил мид в ноль. мораль команды поднял
         inset: {rect: [0.0, 0.06, 0.15, 0.065], width: 640, at: [540, 250], from: 4.0}}
