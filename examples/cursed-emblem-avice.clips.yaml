      - [1185.95, 1188.4]      # я бегу, ребят, ладно, бой (Реквием 19:46.5 → «превосходит богов»)
      - [1188.4, 1198.4]       # нельзя, нельзя, выходим — думаешь? — без ульты — да он только что нажал — кд, кд — не взять их
      - [1200.3, 1204.3]       # ой, бл*ть, меня ультует Бейн с линзой слева. да, да
      - [1207.6, 1209.85]      # я иллюзию нажал, я встал
      - [1211.05, 1214.1]      # ой, ну кстати, они базу нам вынесут как нех*й, как будто бы
