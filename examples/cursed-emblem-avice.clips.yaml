      уходит от ульты Бейна иллюзией и в итоге констатирует: «они базу нам вынесут как нех*й»
    title: "превосходит богов. в одиночку"
    title_alt: ["один в поле не бог", "выживший"]
    desc: "zxcursed на СФе: бог доты есть, команды нет. кто должен был выходить?"
    tags: ["#dota2", "#zxcursed", "#курсед", "#shadowfiend"]
    layout: blur
    subs_skip:
      - [1205.9, 1207.5]       # неразборчиво
    segments:
