# «КУРСЕД СЫГРАЛ НА МАГ СФЕ С ЭМБЛЕМОЙ ЗА 20.000$» (канал Zxcursed Rofls, 24 мин, без чата).
# Одна катка: Курсед — СФ за Тьму (аккаунт devil jin), в войсе Тёмыч и Юник; на Антимаге по
# названию видео — Avice (голосом в клипах не опознан). Враги: Муэрта (social accent), Висп, Бейн.
# В начале ему передают Enigmatic Emblem of the Diretide (жёлтую), «которая стоит 20 тысяч
# долларов». Итог — «Победа сил Света», т.е. проигрыш.
# Вебки нет → blur как в cursed-sf-eul. 8:46–9:12 трек с текстом — не брать.
defaults:
  layouts:
    blur:
      height: 860
  title:
    duration: 3.5
    uppercase: false
    y: 430
  whisper:
    clip_model: large-v3
    language: ru
  subs:
    y: 1530
    who_y: 1438
    replace:
      ops: обс
      OPS: обс
      тёмы: Тёмыч
      тёмыч: Тёмыч
      темыч: Тёмыч
      dota: доту
      юник: Юник
      эмбрию: эмблему
      паховую: похаваю
      постремил: постримил
      парня: парни
      опс: обс
      центри: сентри
      дот: доту
      дефнем: дефнём
      ферст месседжи: first message
      не просылаю трансляцию я говорю: не про свою трансляцию говорю
      посади: ""
      мэй: моей
      "б***ь": бл*ть
      "х***ня": х*йня
      "п***ец": п*здец
      "точнее я забыл я": точнее…
      "не на мэй": ""
      "о я в": ой, я в
      "как нибудь": как-нибудь
      откидать: ""
      ау: ""
      "смог ну": смог уснуть
      обконченный: конченый
      реквим: реквием
      пиздец: п*здец
      пизда: п*зда
      хуйня: х*йня
      хуйни: х*йни
      нахуй: нах*й
      нахуя: нах*я
      ебать: еб*ть
      въебал: вь*бал
      блядь: бл*дь
      блять: бл*ть
      бля: бл*

clips:
  # СЕТАП → РАЗВЯЗКА: эмблема «за 20 тысяч долларов» → последний деф с Реквиемом → «не дефаем» → «Победа сил Света»
  - id: 01-emblema
    format: сетап → развязка
    story: >-
      клип о том, как Курседу прилетает обмен — эмблема, «которая стоит 20 тысяч долларов», он
      боится мисклика, принимает и благодарит, идёт с ней в катку, а в итоге под конец игры
      отчаянно дефает базу Реквиемом, умирает, решает «не дефаем» — «Победа сил Света» и «чё,
      парни, пора выключаться»
    title: "победа в комплект не входит"
    title_alt: ["20 тысяч долларов на удачу", "эмблема есть, победы нет"]
    desc: "zxcursed получил эмблему за 20 000$ и сразу пошёл её тестить. тест не пройден"
    tags: ["#dota2", "#zxcursed", "#курсед", "#shadowfiend"]
    layout: blur
    subs_skip:
      - [1387.85, 1388.3]     # «у…» — начало следующей фразы
    segments:
      - [11.05, 13.15]                              # стрёмно принимать, это может мисклик? (окно обмена)
      - [14.8, 19.35]                               # а чё он ржёт? он просто ржёт. — принимай. бери, пока дают
      - [24.65, 30.05]                              # да ну нах*й! … который стоит, бл*дь, 20 тысяч долларов («Вы обменялись на»)
      - [34.2, 41.15]                               # это подарок от твоих, говорит… спасибо большое
      - [1376.3, 1379.85]                           # 22:56 — надо реквием туда — нету, нету, нету
      - [1382.45, 1387.95]                          # живём, живём, парни, 4 секунды ТП, мы дефаем
      - {start: 1402.9, end: 1405.5, subs: false}   # 23:23 — Реквием у трона
      - {start: 1410.3, end: 1411.9, subs: false}   # 23:30 — «Вы мертвы»
      - [1415.0, 1416.95]                           # дефаем? или не дефаем?
      - [1418.25, 1419.45]                          # не, не дефаем
      - {start: 1421.3, end: 1423.1, subs: false}   # «Победа сил Света»
      - [1437.55, 1439.8]                           # чё, парни? пора выключаться
      - [1440.7, 1442.95]                           # пойду похаваю. ну, нормально постримил

  # ЦЕЛЬНЫЙ ОТРЕЗОК С ПОДРЕЗКОЙ / САМОИРОНИЯ: «ты стилишь» → «меня плавит, встал в 4, не ел» → «ты мылся?»
  - id: 02-mylsya
    format: отрезок с подрезкой (самоирония)
    story: >-
      клип о том, как Курседа ловят на стиле, он путается в оправданиях («мисклик? точнее не
      мисклик»), признаётся, что его плавит — встал в 4 утра и ничего не ел, — а в итоге на «ты
      мылся?» отвечает «нет, сегодня нет… по скилу видно, когда я мытый, когда нет»
    title: "гигиена влияет на ммр"
    title_alt: ["секрет скилла раскрыт", "режим дня киберспортсмена"]
    desc: "zxcursed объяснил, от чего на самом деле зависит скилл. проверять на себе не советуем"
    tags: ["#dota2", "#zxcursed", "#курсед"]
    layout: blur
    segments:
      - [838.75, 841.4]        # нах*я ты стилишь? в смысле стилишь? не расстраивайся
      - [843.85, 847.75]       # мисклик? точнее, не мисклик, а… это не стил, это на блоке
      - [848.55, 858.6]        # меня плавит уже, еле речь могу сформулировать… проснулся в 4 утра… ни*уя не хавал, брат
      - [870.95, 875.25]       # сам организм проснулся, хотел ещё поспать, но не смог уснуть
      - [876.35, 877.75]       # я очень мало спал, парни
      - [891.15, 894.75]       # ты мылся? нет, сегодня нет. а чё, типа, заметно?
      - [896.25, 899.9]        # по скилу как будто бы видно, когда я мытый, когда нет

  # ЭСКАЛАЦИЯ ОПРАВДАНИЙ: обс ломают → бедный → денег нет → «на стриме невозможно» → «…без стрима»
  - id: 03-v-solo
    format: эскалация (оправдания)
    story: >-
      клип о том, как Курсед всю игру ищет виноватых: каждую игру ломают обс, «в соло такого не
      было», каждую игру он бедный, на стриме невозможно играть — а в итоге оговаривается:
      «невозможно в доту играть без стрима»
    title: "в соло такого не было"
    title_alt: ["проклятие стримера", "виноват стрим. или нет"]
    desc: "оправдания zxcursed, новая серия. какая версия самая убедительная?"
    tags: ["#dota2", "#zxcursed", "#курсед", "#оправданиякурседа"]
    layout: blur
    segments:
      - [290.35, 295.25]       # да бл*, что за х*йня? каждая игра у меня обс ломается, ну это п*здец
      - [302.55, 313.75]       # каждую игру у меня челы ломают обс на третьей минуте… в соло ни разу такой х*йни не было
      - [447.95, 451.15]       # у меня так мало, каждую игру я бедный, я не понимаю
      - [510.65, 512.65]       # я без понятия, почему у меня так мало денег
      - [1143.4, 1144.9]       # это просто на стриме невозможно в доту играть
      - [1144.9, 1150.35]      # Тёмыч, скажи… у нас красные ранги должны быть
      - [1150.95, 1153.35]     # но невозможно в доту играть без стрима. ой, точнее…

  # ДИАЛОГ С ЧАТОМ: молчуны в чате → «я тоже боялся писать» → «я супер народный стример»
  - id: 04-narodnyi
    format: диалог с чатом
    story: >-
      клип о том, как Курсед рассуждает о зрителях, которые ни разу не писали в чат, признаётся,
      что сам раньше боялся писать, «мы похожи, поэтому вы меня и смотрите», и в итоге
      провозглашает себя супер народным стримером
    title: "голос молчаливого большинства"
    title_alt: ["стример из народа", "президент молчунов"]
    desc: "zxcursed обращается к тем, кто ни разу не писал в чат. ну что, первый коммент твой?"
    tags: ["#dota2", "#zxcursed", "#курсед"]
    layout: blur
    segments:
      - [1029.55, 1036.9]      # а есть ещё first message? а есть челы, которые смотрят и ни разу ничего не писали
      - [1037.65, 1043.35]     # не, ну очевидно, я не про свою трансляцию… на моей есть такие люди
      - [1044.45, 1049.35]     # в целом в интернете челы, которые сидят и вообще ноль сообщений
      - [1053.1, 1071.55]      # скажите… напишете, и стыдно станет… у меня раньше такое было… я стримлю для вас
      - [1077.55, 1079.75]     # да, ребят, я супер народный стример

  # ПРОВАЛ → РЕВАНШ: «давайте, создал момент» — Реквием в пустоту, «я не таймил» → 3 минуты спустя «забайтил, создал момент»
  - id: 05-moment
    format: сетап → развязка (провал → реванш)
    story: >-
      клип о том, как Курсед кричит «мы убьём их», жмёт Реквием со словами «создал момент», но
      никто не умирает — «а как?!», «я не таймил», «в линк вь*бал»; через три минуты он снова
      лезет в драку, тише-тише, Мана Войд по трём героям, «devil jin зверствует» — и в итоге
      довольное «забайтил, создал момент. и всё»
    title: "создатель моментов"
    title_alt: ["момент, дубль два", "со второй попытки считается"]
    desc: "zxcursed на СФе: первый момент не создался, второй — по учебнику"
    tags: ["#dota2", "#zxcursed", "#курсед", "#shadowfiend"]
    layout: blur
    subs:
      replace:
        "и все": и всё
    subs_skip:
      - [806.5, 808.2]         # «рела, рела жмёт» — не разобрать, модели расходятся
      - [811.2, 812.0]         # «оп/лоб твою» — модели расходятся
    segments:
      - [795.85, 796.95]       # Юник, ты куда, брат?
      - [798.0, 798.75]        # Веспам можем?
      - [800.0, 801.4]         # мы убьём их, мы убьём их
      - [803.75, 805.6]        # давайте, ребят, создал момент (Реквием 13:24.5)
      - [808.1, 809.15]        # а как? как?
      - [809.9, 811.3]         # да еб*ть!
      - [816.95, 818.35]       # бл*, я не таймил
      - [819.3, 821.05]        # ой, я в линк вь*бал
      - [989.0, 996.4]         # 16:29 — ну как-нибудь, как-нибудь… тише, тише (Мана Войд, «зверствует»)
      - [999.4, 1002.3]        # забайтил, забайтил, создал момент. и всё

  # МОМЕНТ → РЕАКЦИЯ: Реквием → «превосходит богов» → «нельзя, выходим» → Муэрта убивает четверых → «базу нам вынесут»
  - id: 06-vyhodim
    format: момент → реакция
    story: >-
      клип о том, как Курсед после убитого керри Реквиемом выходит в «превосходит богов», зовёт
