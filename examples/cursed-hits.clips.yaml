# Курсед угадывает треки на songless.ru (режим «угадай за 0.5 с»). Вебки нет.
# Тот же квиз есть в cursed-bday (15:07–28:36, укороченный монтажом) — квиз берём только отсюда.
# 0:00–1:15 — плейлист его СОБСТВЕННЫХ треков (artists=zxcursed: Level Up, Blood Drip, Never Enough).
# Реклама 3:34–4:39 — не брать. Финал на 31:44: 104 очка из 354, чат пишет «последний».
# Музыка звучит в каждом клипе кусками по 0.5–2 с — предупредить про авторские права.
defaults:
  layouts:
    blur:
      height: 1100
      focus_x: 0.42
  title:
    duration: 3.5
    uppercase: false
    y: 300
  whisper:
    clip_model: null
  subs:
    y: 1300
    replace:
      солитайри: "Solitaire"
      blладриp: "Blood Drip"
      инстасамка: Инстасамка
      моргенштерн: Моргенштерн
      моргентерн: Моргенштерн
      липсиха: "Lipsi Ha"
      платина: Платина
      натуси: "на туси"

clips:
  - id: 01-svoi-treki
    format: цельный отрезок
    story: "клип о том, как Курсед в квизе угадывает плейлист собственных треков за полсекунды, называет каждый «супер изи», и в итоге просит другого исполнителя, потому что так неинтересно"
    title: "курсед угадывает свои треки"
    title_alt: ["угадал себя за полсекунды", "мне нужен другой исполнитель"]
    desc: "zxcursed / Курсед в Songless. а свои любимые треки ты узнаешь за 0.5 секунды?"
    tags: [zxcursed, курсед, songless, музыка]
    layout: blur
    segments:
      - ["0:30.12", "0:58.46"]

  - id: 02-podskazki
    format: сквозная нитка (суперкат)
    story: "клип о том, как Курсед признаётся, что подсмотрел ответ в чате, обещает играть без подсказок, потом раз за разом говорит «я уже увидел чат, но я бы не смог», и в итоге клянётся, что в чат вообще не смотрел"
    title: "клянусь, я не смотрел в чат"
    title_alt: ["честная игра без подсказок", "за меня тут всё сделано"]
    desc: "zxcursed / Курсед угадывает хиты. ты бы тоже подглядывал?"
    tags: [zxcursed, курсед, songless, музыка]
    layout: blur
    segments:
      - ["2:26.59", "2:34.86"]
      - ["19:04.34", "19:08.64"]
      - ["23:43.26", "23:47.96"]
      - ["23:57.00", "24:00.52"]
      - ["29:56.22", "30:02.36"]

  - id: 03-instasamka
    format: цельный отрезок с подрезкой
    story: "клип о том, как Курсед узнаёт Инстасамку, просит чат не подсказывать, перебирает её песни вслух, сам не верит своему ответу «пуси джуси» и в итоге угадывает"
    title: "не подсказывайте, я сам"
    subs_skip:
      - ["25:48.30", "25:49.60"]
    title_alt: ["экзамен по инстасамке", "это не оно. или оно"]
    desc: "zxcursed / Курсед угадывает Инстасамку. угадал бы быстрее?"
    tags: [zxcursed, курсед, songless, инстасамка]
    layout: blur
    segments:
      - ["25:37.02", "25:52.63"]
      - ["26:01.93", "26:07.37"]
      - ["26:11.78", "26:26.24"]

  - id: 04-zhestkiy
    format: сетап → развязка
    story: "клип о том, как Курсед заявляет, что он очень жёсткий в музыке и шарит за тренды, в конце квиза радуется победе и ждёт, что сайт назовёт его красавчиком, и в итоге видит 104 очка из 354 и понимает, что он худший"
    title: "шарит за тренды"
    title_alt: ["104 из 354", "стример играет на победу"]
    desc: "zxcursed / Курсед в Songless. а сколько бы набрал ты?"
    tags: [zxcursed, курсед, songless, музыка]
