  - id: 05-potnyi
    format: самоирония
    story: "клип о том, как Курсед называет себя очень потным игроком, тут же жмёт не тот ответ, объясняет это мисскликом, и в итоге признаёт, что в жизни тут не победит, но он очень потный"
    title: "мисклик не считается"
