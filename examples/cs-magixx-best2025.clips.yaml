# «ЛУЧШИЕ МОМЕНТЫ MAGIXX'A ЗА 2025 ГОД» (MAGIXX CHILL, 12:01) — нарезка нарезчика: ~20 кусков из разных
# стримов, без общего сюжета. Вебка слева посередине почти везде; в кусках 6:20–7:00 вебки нет → blur.
# Ники Magixx в катках: skuswyk666 (4:14), KaHeKu_KENT (6:20–7:24), despair999 (11:20), getboris1337 (майнкрафт).
# 4:44–6:20 — повтор катки из cs-magixx-4k (эйс, «Борис, это как такое возможно») — не брать, уже был клип.
# 11:40–12:01 — заставка «подпишись», не брать. Общий транскрипт — large-v3-turbo (VAD),
# сверка — large-v3 без VAD (lv3.txt); где расходятся — slova в subs_skip.
defaults:
  layouts:
    stream:
      cam: [0.0, 0.49, 0.185, 0.248]
      top_height: 700
  title:
    duration: 3.5
    uppercase: false
    label_y: 1350
  whisper:
    clip_model: null
    language: ru
  subs:
    replace:
      борис: Борис
      боря: Боря
      ваня: Ваня

clips:
  - id: 01-hudshiy-luchshiy
    format: переобувка
    story: >-
      клип о том, как Magixx с бомбой умирает и называет себя худшим игроком в мире, а в итоге
      через пару раундов с AK раздаёт фраги и орёт, что он лучший игрок в мире
    title: "худший и лучший за два раунда"
    title_alt: ["magixx переобулся за два раунда", "самооценка как курс рубля"]
    desc: "Magixx / Мэджикс, лучшие моменты 2025. а ты себя как оцениваешь после смерти?"
    tags: ["#cs2", "#кс2", "#magixx", "#faceit"]
    layout: stream
    subs:
      replace:
        ебалу: ""
        "я разобьюсь": "я разъ*бусь"
        "себя врут": ""
    subs_skip:
      - [244.3, 247.6]              # «Ваня/Таня, я сейчас буду…» — модели расходятся
    segments:
      - ["1:40.5", "1:52.15"]       # один догоняет, бомба у меня… второй раз за сегодня… я худший в мире игрок сейчас
      - ["3:53.7", "4:10.2"]        # проходит, поднял… рампа… Ваня! я лучший игрок в мире, сейчас был два раунда!

  - id: 02-minecraft
    format: оффтоп
    story: >-
      клип о том, как Magixx в майнкрафте лезет в тёмную пещеру, на него выходит игрок с топором,
      и в итоге его убивают, а он орёт громче, чем в кс
    title: "майнкрафт страшнее мажора"
    title_alt: ["magixx зашёл в пещеру", "в кс он так не орёт"]
    desc: "Magixx / Мэджикс в майнкрафте. кто тут Steve Dueller?"
    tags: ["#minecraft", "#майнкрафт", "#magixx", "#cs2"]
    layout: stream
    cam: [0.0, 0.41, 0.19, 0.255]
    subs: false
    segments:
      - ["3:17.0", "3:46.6"]

  - id: 03-delovoe-predlozhenie
    format: диалог (обещание → развязка)
    story: >-
      клип о том, как Magixx делает другу Денчику «деловое предложение» — чтоб вы сдохли, пушит,
      убивает двоих, а в итоге его самого убивают, и он орёт «меня лудоман убил»
    title: "деловое предложение от magixx"
    title_alt: ["переговоры по-магиксовски", "меня лудоман убил"]
    desc: "Magixx / Мэджикс, лучшие моменты 2025. кто такой лудоман по-твоему?"
    tags: ["#cs2", "#кс2", "#magixx", "#faceit", "#donk"]
    layout: stream
    subs:
      replace:
        "пушу вам": "пушу ромб"
        лудомен: лудоман
    subs_skip:
      - [539.5, 543.2]              # «Вабут» / «два бутка» — модели расходятся
      - [546.9, 547.5]
    segments:
      - ["8:48.6", "8:58.95"]       # Денчик, слушай, деловое предложение. чтоб вы сдохли. я пушу ромб. готова? да. вот и всё, на охоту приплыли
      - ["8:58.95", "9:08.9"]      # фраги, смерть: меня лудоман убил!

  - id: 04-vypustil-long
    format: рейдж
    story: >-
      клип о том, как Magixx выпустил врага на лонг и четыре раза кричит тиммейтам «пацаны, не
      подставляйтесь», а в итоге его убивают, и он ржёт и предлагает кикнуть кого-нибудь
    title: "капитан предупреждал четыре раза"
    title_alt: ["пацаны, я выпустил лонг", "magixx предлагает кик"]
    desc: "Magixx / Мэджикс, лучшие моменты 2025. кого кикаем?"
    tags: ["#cs2", "#кс2", "#magixx", "#faceit", "#mirage"]
    layout: stream
    subs:
      replace:
        вышла: вышел
        продл: ""
        "машина продл..": машина
    subs_skip:
      - [497.2, 497.85]             # «ААААА» — крик, без субтитра
    segments:
      - ["7:57.3", "8:10.6"]        # лонг вышел, я выпустил его, пацаны… машина, ну не подставляйтесь! вы чё, е*ались?
      - ["8:13.4", "8:16.9"]        # смерть
      - {start: "8:16.9", end: "8:21.5", layout: blur, layouts: {blur: {height: 1100}}}   # зум нарезчика на вебку → кикнем кого-нибудь, вы е*нутые походу, пацаки!

  - id: 05-boris-tiktok
    format: момент → реакция
    story: >-
      клип о том, как при 12:11 Magixx с AWP просит помощи, раунд кончается вспышкой и смертью,
      игра уходит в овертайм, а в итоге тиммейт ноет «иди нах, Борис, это тикток», и Magixx
      оправдывается «я случайно»
    title: "борис сделал тикток"
    title_alt: ["овертайм по вине бориса", "я случайно"]
    desc: "Magixx / Мэджикс, лучшие моменты 2025. случайно или ради тиктока?"
    tags: ["#cs2", "#кс2", "#magixx", "#faceit", "#overtime"]
    layout: stream
    subs:
      replace:
        бл***: бл*
        нах***: нах*й
    segments:
      - ["9:20.6", "9:31.0"]        # ой, блин. помогите нам! он тебе на хит, ему два дают
      - ["9:31.0", "9:39.5"]        # вспышка → смерть → 12:12. хорошо, пацаны… иди нах, Борис
      - {start: "9:39.5", end: "9:47.7", who: "тиммейт"}   # бл*, это тикток. ну Боря просто тикток сделал. — я случайно, бл*!

  - id: 06-defuz-20hp
    format: хайлайт
    story: >-
      клип о том, как Magixx на ретейке забирает двоих, в том числе w0nderful, и в итоге на
      20 хп без кусачек дефузит бомбу и выигрывает раунд
    title: "дефуз на 20 хп"
    title_alt: ["magixx против w0nderful", "без кусачек и без хп"]
    desc: "Magixx / Мэджикс, лучшие моменты 2025. ты бы пошёл дефузить без кита?"
    tags: ["#cs2", "#кс2", "#magixx", "#faceit", "#clutch"]
    layout: blur
    layouts: {blur: {height: 1100}}
    subs: false
    segments:
      - {start: "6:23.6", end: "6:44.6",
         inset: {rect: [0.6, 0.03, 0.39, 0.12], width: 900, at: [540, 330], from: 6.0, to: 16.5}}   # фраги в килфиде: nevertrick, w0nderful
      - {start: "6:45.6", end: "6:57.4",
         inset: {rect: [0.23, 0.93, 0.1, 0.07], width: 300, at: [540, 330]}}    # дефуз без кита на 20 хп → раунд

  - id: 07-tishina
    format: момент → реакция
    story: >-
      клип о том, как Magixx замечает, что на сайте подозрительно тихо, а в итоге закидывает и
      расстреливает врагов с AWP и сам не верит, что видел их в глаза
    title: "подозрительно тихо"
    title_alt: ["тишина перед авп", "magixx почуял неладное"]
    desc: "Magixx / Мэджикс, лучшие моменты 2025. ты тоже напрягаешься, когда тихо?"
    tags: ["#cs2", "#кс2", "#magixx", "#awp"]
    layout: stream
    subs:
      replace:
        грутична: тишина
        мпф: ""
    segments:
      - ["4:16.3", "4:42.95"]        # тишина какая-то… что такое? о-о-о, е*ать, вау!… я с ума сошёл, что видел их в глаза

  - id: 08-tri-awp
    format: самоирония → хайлайт
    story: >-
      клип о том, как Magixx берёт AWP и объявляет «я как Саня Симпл сейчас буду с авиком»,
      а в итоге забирает троих с AWP подряд и выигрывает раунд с MVP
    title: "magixx включил симпла"
    title_alt: ["как саня симпл с авиком", "трое с авп подряд"]
    desc: "Magixx / Мэджикс, лучшие моменты 2025. какой выстрел лучший?"
    tags: ["#cs2", "#кс2", "#magixx", "#awp"]
    layout: stream
    subs:
      replace:
        симпл: Симпл
        "скачай гендер": ""
        "ай, блядь, я ляпал": ""
    subs_skip:
      - [689.8, 697.4]              # «скачай гендер… промби леву» — неразборчиво
    segments:
      - ["11:19.8", "11:39.0"]      # я не видел даже на экране ничего… три фрага с AWP → MVP

  - id: 09-awp-frag
    format: нарезка фрагов
    story: >-
      клип о том, как Magixx с AWP работает по миражу: сквозь молотов, через окно, по мидлу, и в
      итоге раунды за его командой
    title: "awp в правильных руках"
    title_alt: ["magixx взял авп", "мираж через прицел"]
    desc: "Magixx / Мэджикс, лучшие моменты 2025. какой фраг лучший?"
    tags: ["#cs2", "#кс2", "#magixx", "#awp", "#mirage"]
    layout: stream
    subs: false
    segments:
      - ["2:19.0", "2:24.6"]
      - ["2:31.1", "2:38.2"]
      - ["9:11.0", "9:20.4"]
