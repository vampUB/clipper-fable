# «ГОФРЕН ТЕРЯЕТ РАССУДОК ОТ ЭТОЙ КОМАНДЫ» (канал «ГОФРЕН НАРЕЗКИ», 24 мин, 1080p, без чата).
# Одна катка: Гофрен (blackrabbit342, в игре egorya) на Энигме. Тиммейты: Пудж («200 ранг Африки»,
# «перуанский»), Квопа, керри «фил» на Кезе. Против: Элдер Титан, Луна, Дарк Виллоу и др.
# Итог: «Победа сил Света» 22:57. Вебки нет (статичная картинка слева внизу) → blur.
# Чат стрима виден справа в кадре. Донатер ange1wav3 (3 USD, TTS) дважды: 8:18 «писюнявый ты»
# и 14:00 «играешь под прессером писюнявости…» — нитка через всё видео.
# Тайминги — по словам large-v3 из cache/ (check --asr).
