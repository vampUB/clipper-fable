# «КУРСЕД НА МАГ СФЕ СДЕЛАЛ РАМПАГУ НА 9К ММР?!» (Zxcursed Rofls, 19:00). Одна катка в пабе:
# Курсед (ник «привет», СФ мид за Тьму) — победа, «лучший игрок». Пудж в команде — anemia
# (говорит в войсе, тихий голос −28…−36 дБ; Курсед −14…−24 дБ). Вебки нет → blur.
# 3:09–3:50 — рекламная вставка нарезчика, не брать. Нарезка смонтирована — склейки внутри.
defaults:
  layouts:
    blur:
      height: 860
  title:
    duration: 3.5
    uppercase: false
    y: 430
  whisper:
    clip_model: large-v3
    language: ru
  subs:
    y: 1530
    who_y: 1438
    replace:
      сф: СФ
      сфа: СФа
      сфе: СФе
      SF: СФ
      "ШД Фредди": "Шадоу Фреде"
      проиграю: проигрываю
      сплачено: схвачено

clips:
  # СЕТАП → РАЗВЯЗКА: чат «нету ауры на СФе» → «ставлю жопу, выиграем» → победа → «кто писал, что у моего СФа нет ауры?»
  - id: 01-aura
    format: сетап → развязка
    story: >-
      клип о том, как чат перед игрой пишет Курседу «нету ауры на СФе», он посреди катки ставит
      жопу на то, что выиграет, и в итоге после победы на экране «лучший игрок» вспоминает того,
      кто писал про ауру
    title: "аура курседа под сомнением"
    title_alt: ["чат усомнился в ауре", "аура подтверждена"]
    desc: "zxcursed на СФе. есть аура или нет, решайте сами"
    tags: ["#dota2", "#zxcursed", "#курсед", "#shadowfiend", "#аура"]
    layout: blur
    segments:
      - [2.1, 4.8]                            # ну, я не знаю, я тут не проигрываю на Шадоу Фреде (история матчей)
      - {start: 4.95, end: 6.9, who: "читает чат"}   # нету ауры на СФе у тебя
      - [688.6, 695.3]                        # но мы, если что, выиграем, парни… кто там ставочку поставил. я ставлю жопу
      - [1094.85, 1098.75]                    # всё, парни, победа, вы боялись. всё схвачено
      - [1124.15, 1133.7]                     # кто там писал, что у моего СФа нет ауры? я видел в чате… кто-то был (экран «лучший игрок»)

  # ХАЙЛАЙТ: умер → выкупился → «рэмпейдж хочу» → БУЙСТВО
  - id: 02-rampage
    format: хайлайт
    story: >-
      клип о том, как Курсед умирает в драке, выкупается, прыгает Реквиемом обратно, добивает
      одного за другим, вслух заказывает рампагу и в итоге получает «БУЙСТВО»
    title: "рампага по заказу"
    title_alt: ["заказал рампагу", "выкупился ради рампаги"]
    desc: "zxcursed на маг. СФе, 9к лобби. выкуп того стоил?"
    tags: ["#dota2", "#zxcursed", "#курсед", "#shadowfiend", "#rampage"]
    layout: blur
    segments:
      - [748.9, 753.6]          # драка, СФ умирает: «я умер. но я же с байбэком»
      - [759.0, 789.0]          # выкуп 12:39 → Реквием 12:44 → «и этого, и того, и этого» → «3 секунды, я прыгну»
      - [793.9, 807.3]          # «рэмпейдж хочу, дайте мне рэмпейдж» → 13:20 БУЙСТВО → «было, было, было! а вы хотели сдаваться?»

  # САМОИРОНИЯ / ЭСКАЛАЦИЯ: «я не стараюсь, мне пох» → рейдж → «если думаете, что я потею — ошибаетесь»
  - id: 03-ne-poteyu
    format: эскалация (самоирония)
    story: >-
      клип о том, как Курсед уверяет, что не старается и ему всё равно, потом орёт на игру и
      тиммейтов, просит помощи, а в итоге заявляет, что совсем не потеет: ноги на клавиатуре,
      зашёл получить удовольствие
    title: "курсед совсем не потеет"
    title_alt: ["ноги на клавиатуре", "зашёл получить удовольствие"]
    desc: "zxcursed спокоен как никогда. веришь?"
    tags: ["#dota2", "#zxcursed", "#курсед", "#shadowfiend"]
    layout: blur
    subs:
      replace:
        "Лола,": "Лол,"
        "пизда,": "п*зды,"
        "0 помощи": "ноль помощи"
        пульс: Пудж
        белка: Белка
        дизрапторе: Дизрапторе
        пори: парни
        "поп и на на": "пох*й на"
    segments:
      - [182.8, 189.45]         # лол, как не добил. ну если честно, парни, я не стараюсь… мне пох*й
      - [316.35, 319.0]         # да я е*ал эту игру
      - [324.85, 331.95]        # ну почему ноль помощи, почему я один стою? сабдив е*нутый какой-то, чел на Дизрапторе в соло играет
      - [345.45, 350.9]         # мне не нравится, как играет мой Пудж. и Белка, скажу честно
      - [497.5, 498.75]         # ну помогите мне
      - [503.8, 507.3]          # да я в это не верю
      - [510.0, 524.0]          # если вы думаете, что я потею — ошибаетесь… зашёл получить удовольствие. правильно, правильно

  # ДИАЛОГ В ВОЙСЕ / ОФФТОП: пауза → «помяукай, Пудж» → «мяу» → «один я с мужским голосом»
  - id: 04-myau
    format: диалог в войсе
    story: >-
      клип о том, как на паузе Курсед уговаривает Пуджа помяукать «чтобы поднять мораль команды»,
      тот сдаётся и мяукает, а в итоге Курсед удивляется, что у всех в команде такие голоса и он
      один с мужским, и отвечает чату, что голос не давит
    title: "мораль команды поднята"
    title_alt: ["курсед поднял мораль команды", "мяу ради победы"]
    desc: "zxcursed и его Пудж. помогло бы тебе мяу от тиммейта?"
    tags: ["#dota2", "#zxcursed", "#курсед", "#pudge"]
    layout: blur
    whisper: {clip_model: null}     # large-v3 путает тихий войс Пуджа («помилкать», «польше»)
    subs_skip:
      - [537.7, 539.6]              # «что за … в команде у меня» — слово модели слышат по-разному
    subs:
      replace:
        "Чего у них хубстек": "Чё у них у всех"
        "он сделал": "сделать"
        "помяук, а на пуд же": "помяукай, а, Пудж"
        "Помяук,": "Помяукай,"
        "на пуд же,": "Пудж,"
        понять: поднять
        въёпываемся: в*бываемся
    segments:
      - {start: 437.05, end: 438.5, who: "Курсед"}            # помяукай, а, Пудж, слышишь? (игра на паузе)
      - {start: 443.15, end: 443.7, who: "Пудж · anemia"}     # сколько можно?
      - {start: 443.85, end: 447.75, who: "Курсед"}           # а пауза? можешь помяукать, пожалуйста? мораль команды поднять
      - {start: 447.85, end: 448.65, who: "Пудж · anemia"}    # что сделать?
      - {start: 448.7, end: 449.6, who: "Курсед"}             # ну скажи «мяу»
      - {start: 449.85, end: 452.3, who: "Пудж · anemia",
         inset: {rect: [0.885, 0.632, 0.115, 0.036], width: 560, at: [540, 250]}}   # мяу-мяу-мяу-мяу (плашка войса Пуджа)
      - {start: 453.95, end: 457.1, who: "Курсед"}            # хорошо. мы прям в*бываемся, парни
      - [535.9, 542.25]                                       # что у них у всех с голосами?… один я с мужским голосом сижу
      - [560.95, 563.8]                                       # «не дави голос» — это мой обычный голос
