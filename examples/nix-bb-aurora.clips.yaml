# Nix смотрит BB Team vs Aurora (+ BB vs PARIVISION), TI 2026
# Вебка: в HUD внизу слева (по умолчанию); на камерах игроков — слева по центру.

defaults:
  layouts:
    stream:
      cam: [0.175, 0.81, 0.188, 0.19]
      top_height: 612
  title:
    duration: 3.5
    uppercase: false
  whisper:
    clip_model: large-v3
  subs:
    replace:
      бутбум: Бетбум
      бэтбум: Бетбум
      бетбум: Бетбум
      бутбол: Бетбум
      бэдбум: Бетбум
      бутбом: Бетбум

clips:
  # Правило №4 «не ставить на Бетбум» → ставки горят → правило №5 «как нейронка, обучаюсь»
  # → «на обидках создал правило, которое меня и погубило»
  - id: 01-pravila
    title: "главное от своих идей не отходить"
    layout: stream
    subs:
      replace:
        испан: Виспа
        спа: Виспа
        фальконом: Фальконам
        битках: обидках
        погубила: погубило
    subs_skip:
      - [2536.3, 2536.48]     # «к» — хвост от «сказать»
    segments:
      - [22.6, 27.85]         # нужно пользоваться правилом 4… не ставить на Бетбум
      - [1151.05, 1153.25]    # плохая ставка от меня, очень плохая
      - [1664.95, 1669.25]    # главное от своих идей не отходить… свои правила не буду нарушать
      - [2435.15, 2439.65]    # правило номер пять… как нейронка, обучаюсь по ходу
      - [2536.35, 2546.0]     # почему такая ситуация… на обидках создал правило, которое меня и погубило

  # «Я за Наруто. Наруто ещё покажет» → «забудьте вообще про Наруто»
  # Kiritych (BB) — Наруто, Satanic (Алан, PARIVISION) — Саске
  - id: 02-naruto
    title: "наруто ещё покажет"
    layout: stream
    subs:
      replace:
        соски: Саске
        еще: ещё
        роботизирован: роботизированным
        саски: Саске
        алан: Алан
        этого: это
        народ: Наруто
        жирай: с Джирайей
        тора: Яторо
        ивану: еб*нутый
        его: еб*нутый
        сжирай: с Джирайей
        чтобы: обыграть
        ебанутый: еб*нутый
    subs_skip:
      - [3479.1, 3479.29]     # «но» из «его но ты» (= ебанутый)
      - [3479.28, 3479.45]    # «ты» из «ивану ты» (= ебанутый)
      - [3483.68, 3483.92]    # «играть» из «чтобы играть» (= обыграть)
      - [3482.85, 3483.12]    # «я» из «я тора» (= Яторо)
    segments:
      # монтажёр канала дал вебку на весь кадр — крупное лицо в хук
      - {start: 2652.8, end: 2655.25, layout: crop,
         layouts: {crop: {rect: [0.0, 0.02, 0.955, 0.95], focus_x: 0.36}}}
      - {start: 2730.8, end: 2735.25, cam: [0.0, 0.465, 0.238, 0.235]}   # арка, где Саске сильнее…
      - {start: 2736.2, end: 2739.4, cam: [0.0, 0.465, 0.238, 0.235]}    # только сценарист знает
      - {start: 2794.4, end: 2798.25, cam: [0.0, 0.465, 0.238, 0.235]}   # вот он реальный Наруто. Алан — чистейший Саске
      - [3305.2, 3312.05]     # лучше быть импульсивным… поэтому я за Наруто. Наруто ещё покажет
      - [3432.45, 3433.95]    # это Наруто до тренировок с Джирайей
      - [3436.25, 3438.15]    # сейчас он тренируется, ребят, подождите
      - [3477.6, 3479.75]     # он ебанутый гений
      - [3482.7, 3485.3]      # только Яторо может обыграть. забудьте вообще про Наруто

  # «Бетбум очень плохая команда» → «Браво, Бетбум. Заслуженный проход в плей-офф»
  - id: 03-pereobulsya
    title: "переобулся в прыжке"
    layout: stream
    subs:
      replace:
        быть: Бетбум          # «быть бум» = Бетбум
    subs_skip:
      - [498.1, 498.35]       # «бум» из «быть бум»
      - [2637.85, 2638.5]     # «опердрафт/овердрафт» — модели расходятся
    segments:
      - [492.35, 494.15]      # ребят, я вам скажу так. забейте
      - [497.45, 499.65]      # Бетбум очень плохая команда просто
      - [510.42, 512.6]       # это какой-то нонсенс то, что я сейчас вижу
      - [2635.4, 2641.3]      # ГГ пишет Аврора. Браво, Бетбум… заслуженный проход в плей-офф

  # Сатаник фармит: «никто так не бьёт крипов, как он… ну вот я тоже хорошо бью крипов»
  - id: 04-kripy
    title: "бить крипов — это искусство"
    layout: stream
    subs:
      replace:
        пизда: п*здато
        пиздато: п*здато
        блядь: бл*дь
    subs_skip:
      - [3503.2, 3503.45]     # «то» из «пизда то»
    segments:
      - [3208.0, 3211.35]     # дрочим, дрочим крипов
      - [3499.8, 3507.75]     # настолько хорошо понимает мету… вроде крипы у всех
      - [3508.45, 3511.9]     # никто так не бьёт крипов, как он. ну вот я тоже хорошо бью крипов

  # Конец стрима: Nix внезапно выбирает арбуз
  - id: 05-arbuz
    title: "аналитик широкого профиля"
    layout: blur
    layouts:
      blur:
        height: 1000
    whisper:
      clip_model: null        # large-v3 теряет здесь куски речи — берём общий транскрипт
    subs:
      replace:
        двонки: звонкий
        звонки: звонкий
        ежжал: лежал
    segments:
      - [3651.6, 3661.45]     # звук. не знаю, вам слышно? во! звонкий очень
      - [3679.15, 3684.6]     # по пятну можно смотреть, сколько он лежал на земле
      - [3686.3, 3687.9]      # напитался солнцем
      - [3694.65, 3699.2]     # вот это основные вещи, по которым ты можешь определять

  # ===================== подборка 2: шесть разных форматов =====================

  # СУПЕРКАТ: Егор (Nightfall) и БКБ — 7 повторов по нарастающей
  - id: 06-bkb
    title: "бкб — для слабаков"
    layout: stream
    subs:
      replace:
        пока: БКБ             # «пока бы» = БКБ
        шар: Шард
    subs_skip:
      - [2067.62, 2067.76]    # «бы»
      - [2070.08, 2070.36]    # «бы»
    segments:
      - [816.1, 817.78]       # но всё равно БКБ забыл нажать
      - [827.2, 830.35]       # что-то вообще он на этом турике БКБ не нажимает, я заметил
      - [830.3, 832.3]        # что-то как-то ему вообще впадло
      - [835.4, 836.9]        # а что он не нажал-то БКБ?
      - [2066.3, 2068.25]     # я думаю, Егору надо БКБ покупать
      - [2069.7, 2071.15]     # шарт БКБ ему надо здесь покупать
      - [2316.7, 2319.6]      # Егор не купил БКБ. ну, может, потом купит, конечно

  # МОМЕНТ → РЕАКЦИЯ: сначала сейв Микото на весь экран, потом лицо
  - id: 07-mikoto
    title: "реакция быстрее пинга"
    layout: stream
    subs:
      replace:
        микота: Микото
        блядь: бл*дь
        ебанутая: еб*нутая
    segments:
      - {start: 1046.6, end: 1048.6, layouts: {stream: {game: [0.36, 0.05, 0.28, 0.6]}}}   # Микота… Микота успел! (крупно, где сейв)
      - [1048.6, 1053.35]     # что, бл*дь? какая еб*нутая реакция. просто туда полетели кирпичи

  # ЭСКАЛАЦИЯ: страшно ставить против Виспа → ещё страшнее → тирада «керри Висп — бред»
  - id: 08-visp
    title: "виспофобия"
    layout: stream
    subs:
      replace:
        вору: Аврору
        вес: Виспа
        виспо: Виспа
        ландруид: Лон Друид
        мба: имба
        нихуя: ни*уя
        стал: стало
        веспа: Виспа
        виск: Висп
        берет: еб*т
        ебет: еб*т
        ебёт: еб*т
        пока: БКБ
        потратить: потратит
        лондон: Лон Друид
        делают: делает
        дерьма: д*рьма
    subs_skip:
      - [1568.88, 1569.02]    # «по» из «после вес по мне»
      - [2612.58, 2613.0]     # «ставить/стоять/оставить» — модели расходятся
    segments:
      - {start: 1565.9, end: 1569.85, layouts: {stream: {game_focus_x: 0.85}}}   # драфт: Kiritych на IO. я хотел на Аврору, но после Виспа страшно
      - [1620.9, 1624.8]      # если ставить, то на Аврору. но очень страшно ставить против Виспа
      - [2596.8, 2598.25]     # не, ну керри Висп — это просто бред
      - [2603.05, 2614.2]     # бежит и еб*т их под фонтан… нельзя против керри Виспа ставить. это прям имба

  # ЦЕЛЬНЫЙ ОТРЕЗОК: «PARIVISION играют черепашье» → тут же 10 лвл у Сатаника на 11 минуте
  - id: 09-cherepashki
    title: "черепашки-ниндзя"
    layout: stream
    whisper:
      clip_model: null        # large-v3 на окне рендера путается — берём общий транскрипт
    subs:
      replace:
        привижен: PARIVISION
        подбум: Бетбум
        леву: левел
        учела: у чела
        кащается: качается
    segments:
      - [2982.3, 2995.95]     # мне Спирит и Бетбум больше нравятся. PARIVISION черепашьи… 10 лвл на 11 минуте… сумасшедший

  # ОТРЕЗОК С ПОДРЕЗКОЙ: фэнтези-копиум — «не так уж и низко», у кого больше — «своих поставил»
  - id: 10-fentezi
    title: "не так уж и низко"
    layout: stream
    whisper:
      clip_model: null        # здесь общий транскрипт (small) разборчивее, чем large-v3
    subs:
      replace:
        фэнтезе: фэнтези
        хулиганов: Хулиганов
        прямо: прям
        еще: ещё
    segments:
      - [3527.85, 3530.95]    # как он мне так мало в фэнтези приносит? ой, я вообще что-то на низах
      - [3531.05, 3532.3]     # нет, ну ладно, не прям уж на…
      - [3535.65, 3537.95]    # не так уж и низко, я вам так скажу
      - {start: 3545.25, end: 3550.8, layouts: {stream: {game_focus_x: 1.0}}}  # Стренджер своих Хулиганов поставил. ха-ха-ха
      - {start: 3565.85, end: 3569.4, layouts: {stream: {game_focus_x: 1.0}}}  # у меня ещё не так всё плохо с этими 50 000 (на экране «Итого 50144»)
      - {start: 3583.15, end: 3586.0, layouts: {stream: {game_focus_x: 1.0}}}  # Булк 71 тысяча. своих поставил, по-любому

  # ХОТ-ТЕЙК: «вся китайская дота умерла… партия уничтожит за это»
  - id: 11-kitai
    title: "партия недовольна"
    layout: stream
    subs:
      replace:
        dota: дота
        лигу: Лигу
        легенд: Легенд
        perfect: Perfect
        world: World
    segments:
      - [2130.1, 2131.95]     # братан, вся китайская дота умерла
      - [2135.4, 2138.85]     # ну это позор. партия уничтожит за это. ты чё, сам подумай
      - [2166.45, 2168.75]    # китайцы будут играть в Лигу Легенд, ребят
      - [2169.45, 2171.8]     # притока игроков новых вообще нет
      - [2171.8, 2175.7]      # все игроки на этом инте — старички, по 20 лет играют
      - [2175.7, 2180.35]     # сцена китайская мертва, паблик невозможно найти, Perfect World отказался от серверов
