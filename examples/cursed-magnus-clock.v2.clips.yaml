# v2 подборки cursed-magnus-clock (после отзыва v10): эпизоды целиком 22–56 с, споры с ответами,
# врезки: плашка войса WinFull (Клок) пока он говорит, У/С/П, курьер с мантиями. Субтитры — large-v3.
# Плашки войса размечены автоматически по оранжевой точке (WinFull) — см. CLAUDE.md, раздел 9.
# v2: Курсед на Магнусе + хейтер на Клокверке (WinFull, плашка войса с оранжевой точкой).
# Каждый эпизод целиком; врезка плашки войса — пока говорит Клок (генерируется по voice2.json).
defaults:
  layouts:
    blur:
      height: 860
  title:
    duration: 3.5
    uppercase: false
    y: 430
  whisper:
    clip_model: large-v3
  subs:
    y: 1530
    replace:
      магнус: Магнус
      магнусе: Магнусе
      магнуса: Магнуса
      магнусы: Магнуса
      клока: Клока
