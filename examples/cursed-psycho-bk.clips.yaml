# «КУРСЕД ПОКАЗАЛ 7.42 СФА НА БК ВМЕСТЕ С ПСИХОКИДС» (Zxcursed Rofls, 45:12, 21.11.2026).
# Battle Cup, команда «ox0ta Ha4aJLaCb» («охота началась»): zxcursed (devil jin), Avice (Тёмыч,
# highway patrol), mary_day (Никита/Некит, underoath), Unique (Юник), akumaqqe (Акума).
# Игра 1 (0:00–14:20) — рандом, Курсед на Wraith King, победа → полуфинал.
# Игра 2 (14:20–28:38) — «на сигнах»: СФ, Инвокер, Primal Beast, Морф, Худвинк — победа → гранд-финал.
# Игра 3 (28:40–45:12) — гранд-финал vs Team FlyFly: Курсед на Террорблейде четвёркой, Arc Warden
# (Тёма), Shadow Demon (Никита), Magnus (Юник) — проигрыш (Абаддон, Войд MMR Police, Лешрак).
# 3:08–4:05 — реклама нарезчика; 15:20, 24:25 — вставка нарезчика (прицел «+420»).
defaults:
  layout: blur
  layouts:
    blur:
      height: 860
  title:
    duration: 3.5
    uppercase: false
    y: 430
  whisper:
    clip_model: large-v3
    language: ru
  subs:
    y: 1530
    replace:
      юник: Юник
      юника: Юника
      тёмыч: Тёмыч
      войт: Войд
      абадона: Абаддона
      абадон: Абаддон
      абаддоном: Абаддон

