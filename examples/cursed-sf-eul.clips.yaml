# Курсед на маг. СФе через Еул (без вебки). 10 клипов — 10 разных форматов.
defaults:
  layouts:
    blur:
      height: 860              # кадр игры крупнее, края по бокам подрезаны
  title:
    duration: 3.5
    uppercase: false
    y: 430                     # ближе к кадру игры
  whisper:
    clip_model: large-v3
  subs:
    y: 1530                    # ниже кадра, на размытом фоне — не закрывает HUD
    replace:
      юл: Еул
      юуле: Еуле
      котл: Котл
      котла: Котла
      бэтрайдера: Бэтрайдера
      пиздец: п*здец
      пизда: п*зда
      ебаная: еб*ная
      похуй: пох*й
      въебали: в*бали
      хуйня: х*йня
      блядь: бл*дь
      бля: бл*

clips:
  # ЦЕЛЬНЫЙ ОТРЕЗОК: «я в доту очень жёстко играю… не в данный момент, а в целом»
  - id: 01-v-celom
    title: "очень жёстко играю. в целом"
    layout: blur
    whisper: {clip_model: null}     # здесь small разборчивее large-v3
    subs:
      replace:
        ров: рофл
        -локатка: -катка
    segments:
      - [665.3, 688.2]

  # СУПЕРКАТ: оправдания по ходу игры
  - id: 02-opravdaniya
    title: "я нормальный, я нормальный"
    layout: blur
    subs:
      replace:
        улл: ульт
        ул: ульт
        акбайр: акк-байер
    segments:
      - [798.3, 801.15]       # это пока разминочный ульт Реквием был
      - [1389.7, 1393.05]     # у меня реально пролагивает. это не троллинг
      - [1642.1, 1645.85]     # я честно не акк-байер, поверьте. я нормальный, я нормальный
      - [1649.2, 1650.65]     # очевидно, я на контент

  # ЭСКАЛАЦИЯ: стрим-снайпинг
  - id: 03-snaiping
    title: "судьба популярных стримеров"
    layout: blur
    subs:
      replace:
        стримснайпер: стрим-снайпер
    segments:
      - [762.2, 774.45]       # как будто стрим снайпят… судьба стримеров. популярных, очевидно
      - [1233.1, 1240.0]      # они все мои движения видят… каждый мой выход видят
      - [1714.7, 1721.75]     # это стрим-снайпер… у него ранг 2000, если чё

  # СЕТАП → РАЗВЯЗКА: «Котла я всё равно не убью» → «Килл Котл!»
  - id: 04-kotl
    title: "главное — не пытаться убивать котла"
    layout: blur
    segments:
      - [109.3, 110.95]       # Котл? ну, Котл пох*й
      - [112.05, 117.35]      # Котла я всё равно не убью… главное не пытаться убивать его. всё равно не получится
      - [841.3, 845.0]        # 10 секунд, го топ… килл Котл, килл Котл
      - [850.9, 858.0]        # давай… ну хотя бы Котла, найс

  # ОБЕЩАНИЕ → ОПРАВДАНИЕ: «но я не обосрусь» → «пауза была специально»
  - id: 05-pauza
    title: "маны мало. отмазок много"
    layout: blur
    subs:
      replace:
        астан: стан
        остан: стан
        тэпнулся: тапнулся
    segments:
      - [712.9, 720.85]       # надо бы кого-то шатнуть. под паузу? если я ещё и под паузу обосрусь — конец. но я не обосрусь
      # доказательство: «Недостаточно маны» крупно, сразу пауза (под ним играет трек — без субтитров)
      - {start: 1021.0, end: 1023.9, subs: false, zoom: 1.4, focus: [0.5, 0.6]}
      - {start: 1023.9, end: 1025.6, subs: false}   # «ИГРА ПРИОСТАНОВЛЕНА»
      - [1037.1, 1051.1]      # вы подумаете, я не рассчитал ману — на самом деле поставил паузу специально…

  # МИНИ-ГАЙД ПОСЛЕ ФЕЙЛА: забыл про БКБ → «тайминг был идеален… так вам на будущее»
  - id: 06-taiming
    title: "тайминг был идеален"
    layout: blur
    subs:
      replace:
        таком: так вам
        bkb: БКБ
    segments:
      - [1522.0, 1523.85]     # блин, у него же БКБ
      - [1530.1, 1532.85]     # я, если чё, забыл, что у него БКБ
      - [1540.6, 1544.85]     # кстати, тайминг был идеален, практически идеален
      - [1548.7, 1556.15]     # если нажимаете БКБ в Еуле кликом — активируется даже в хроносферу
      - [1565.2, 1567.15]     # это так вам на будущее

  # ДИАЛОГ С ЧАТОМ: «есть нарезчик?… уже выложили? репорт кинул, придётся удалять»
  - id: 07-narezchik
    title: "нарезчик, ничего личного"
    layout: blur
    whisper: {clip_model: null}     # large-v3 здесь путается
    subs:
      replace:
        нарежщик: нарезчик
        нех: нечего
        прилосу: придётся
    subs_skip:
      - [141.25, 141.45]      # «чао» — неразборчиво
    segments:
      - [132.2, 133.3]        # чё, есть нарезчик?
      - [136.7, 142.45]       # надеюсь, он не будет первую катку выкладывать. там нечего смотреть. вот эту катку можно выложить
      - [154.3, 157.9]        # уже выложили? ну, репорт кинул. придётся удалять

  # ОФФТОП: старая музыка во ВКонтакте
  - id: 08-vk
    title: "раскопки вконтакте"
    layout: blur
    subs:
      replace:
        пасы: посты
        мамонтом: мамонта
    segments:
      - [1077.4, 1081.2]      # а что если я зайду прямо сейчас ВКонтакте? извиняюсь, конечно
      - [1083.5, 1093.75]     # старая музыка, не обновлялась лет пять… посты по 30 тысяч лайков. давным-давно
      - [1096.5, 1105.3]      # плейлист… ну это п*здец… говно мамонта. это гибель

  # САМОИРОНИЯ: «моя команда меня ненавидит… стыдновато, но не прям фу»
  - id: 09-stydno
    title: "стыдно, но не прям фу"
    layout: blur
    segments:
      - [1428.3, 1438.95]

  # ПЕРЕОБУВКА: «теперь мы точно в*бали, из-за меня» → «Победа сил Света»
  - id: 10-gg
    title: "точно проиграли. гг"
    layout: blur
    subs_skip:
      - [1820.85, 1821.15]    # «м***/мать» — модели расходятся
    segments:
      - [1462.75, 1464.35]    # да, вот теперь мы точно в*бали
      - [1468.0, 1470.15]     # мы реально в*бали, но это ещё мы из-за меня в*бали
      - [1813.9, 1817.1]      # ГГ? ГГ, парни (на экране «Победа сил Света»)
      - [1817.9, 1822.1]      # сколько мне дало за эту игру? блин, я как м*** полная сыграл

  # ===================== подборка 2: клипы с идеей, подписи — ирония/мемы, не цитаты =====================

  # СЖАТАЯ ИСТОРИЯ: охота на Антимага через всю игру → чат советует Абиссал → «выжил на 1 хп»
  - id: 11-antimag
    title: "план надёжный, как швейцарские часы"
    layout: blur
    subs:
      replace:
        абисал: Абиссал
        abyssal: Абиссал
        бисал: Абиссал
        обисал: Абиссал
        обиссал: Абиссал
        описал: Абиссал
        1кп: 1 хп
        ебут: ""
        антимага: Антимага
        антимаг: Антимаг
        веном: Свеном
        кп: хп
        убиваете: убивайте
        хуйню: х*йню
        ебаную: еб*ную
        братанчиков: братанчик
    segments:
      - [722.8, 724.95]       # ну, Антимага, если что, я шатну
      - [998.3, 1001.45]      # и надо Антимага по… а, пофиг на Антимага
      - [1571.7, 1578.15]     # Абиссал? мне нравятся твои идеи, братанчик. я сделаю Абиссал
      - [1631.8, 1637.15]     # мне нужен Абиссал, я буду прыгать в Антимага, и мы со Свеном будем убивать его
      - [1692.3, 1695.8]      # так, я сейчас продаю эту х*йню. сколько? 1600
      - [1697.1, 1699.4]      # я покупаю Абиссал. пох*й на байбэк
      - [1781.9, 1787.1]      # убивайте Антимага! … Антимаг выжил на 1 хп

  # ПЕТЛЯ: «хотите, чтобы я катки на ютуб записывал? — я не собираюсь это делать» (и по кругу)
  - id: 12-yutub
    title: "мнение чата учтено"
    layout: blur
    segments:
      - [118.0, 123.35]

  # ОЖИДАНИЕ vs РЕАЛЬНОСТЬ: «я не могу не затаймить» → три фейла подряд
  - id: 13-master
    title: "мастер таймингов"
    layout: blur
    subs:
      replace:
        нахуй: нах*й
    subs_skip:
      - [648.7, 651.6]        # крик «мааа!» — без субтитров, large-v3 тут путается
    segments:
      - [810.8, 814.45]       # я даже удивлён, что затаймил. ну, я не могу не затаймить
      - [858.8, 863.65]       # е, нет, нет, нет! бл*, ну я не доставал на него Еул
      - [648.8, 651.2]        # …но у меня мааааа!
      - [655.4, 656.3]        # это конец
      - [1755.3, 1757.75]     # да нах*й ты нажал? бл*, я ульту зря нажал, парни

  # ===================== хайлайты =====================

  # ХАЙЛАЙТ: финальная драка — два Реквиема, 2 килла, трон падает (речь неразборчива — без субтитров)
  - id: 14-final
    title: "та самая разминочная катка"
    layout: blur
    subs: false
    segments:
      - [1797.5, 1813.8]

  # ХАЙЛАЙТ: «изи фраг» — ещё один Котл
  - id: 15-izi
    title: "неубиваемый котл, часть 2"
    layout: blur
    subs:
      replace:
        эйзи: изи
    segments:
      - [1505.2, 1516.6]      # вот он. Котл… нормально, нормально. изи фраг
