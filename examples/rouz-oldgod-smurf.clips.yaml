# rouszztrash, Twitch VOD v2924186080 (11.11.2026), отрезок VOD 0:52:52–1:33:04 (offset 3171.7 с).
# Катка на Антимаге (hostage of perfection) с Виспом «Legend» (30 тир, аватарка как у Старого Бога).
# Всю игру Роузтреш уверен, что это смурф Старого Бога, подлизывается («это без подсоса»),
# а после победы Виспер пишет в чат: «Саня, сорри, это был я на Виспе, я не Старый Бог».
# YouTube-ролик автора («ПОПАЛСЯ СО СМУРФОМ СТАРОГО БОГА…») обрывается ДО разоблачения.
# Вебки нет (вместо неё статичная картинка с котами) → blur, как у Курседа.
# «150 ранг / 8520 мейн / Immortal draft» — рофл (пользователь): на экране выбора ALL PICK, ранг 2 065.
# Границы — по словам large-v3 (общий транскрипт small спешит на 1–2 с, сверено на слух medium-моделью).
# В cache/ поправлены вручную (сверено medium по коротким окнам): «саня» 35:16.7, «Вася» 29:47.8,
# финальная фраза 36:01.9–36:06.2; оригиналы — cache_backup/.
defaults:
  layouts:
    blur:
      height: 860
  title:
    duration: 3.5
    uppercase: false
    y: 430
  whisper:
    clip_model: large-v3
    language: ru
  subs:
    y: 1530
    who_y: 1438
    replace:
      старый бог: Старый Бог
      старого бога: Старого Бога
      старому богу: Старому Богу
      старым богом: Старым Богом
      старый бок: Старый Бог
      висп: Висп
      виспа: Виспа
      виспе: Виспе
      антимаг: Антимаг
      антимага: Антимага
      антимаге: Антимаге
      антимагом: Антимагом

