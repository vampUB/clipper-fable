# cs-aunkere-battle: сборник твич-клипов по CS2 (канал Say CS2 Clips, 18.08.2025).
# Главная нить — BetBoom Streamers Battle 3, команда Aunkere (капитан Aunkere = Женя, Nix = Саша,
# FL4MUS, yariksupra, risenHAHA). 14.08, первая карта против Hooch team (Mirage).
# Вебки у всех разные: в POV маленькая вебка -> stream (cam размечен по сетке на каждый кусок),
# где нарезчик увеличил вебку -> crop на лицо, без вебки (матч, меню, килфид) -> blur 860.
defaults:
  layouts:
    blur:
      height: 860
    stream:
      top_height: 700
  title:
    duration: 3.5
    uppercase: false
    y: 700
  whisper:
    clip_model: large-v3
  subs:
    y: 1480
    replace:
      женек: Женёк
      "1700 л": "1700 эло"
      "1700 тел": "1700 эло"
      хоразменные: разменные
      карату: Карату
      "запушил б": "запушил Б"
      каратик: Каратик
      сензу: Сензу
      сэнсу: Сензу
      баркрафт: Варкрафт

