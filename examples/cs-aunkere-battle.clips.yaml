# cs-aunkere-battle: сборник твич-клипов по CS2 (канал Say CS2 Clips, 18.08.2025).
# Главная нить — BetBoom Streamers Battle 3, команда Aunkere (капитан Aunkere = Женя, Nix = Саша,
# FL4MUS, yariksupra, risenHAHA). 14.08, первая карта против Hooch team (Mirage).
# Вебки у всех разные, нарезчик сам увеличивает вебку на реакциях -> blur 860 у всех клипов.
defaults:
  layouts:
    blur:
      height: 860
  title:
    duration: 3.5
    uppercase: false
    y: 430
  whisper:
    clip_model: large-v3
  subs:
    y: 1530
    replace:
      женек: Женёк
      "1700 л": "1700 эло"
      "1700 тел": "1700 эло"
      хоразменные: разменные
      карату: Карату
      "запушил б": "запушил Б"
      каратик: Каратик

clips:
  - id: 01-spor
    format: момент → реакция + цельный спор (реакция как хук)
    story: "клип о том, как на пистолетке Solo в одиночку пушит апартаменты и убивает четверых из команды Aunkere, Nix доказывает, что убегать от одного нельзя, Aunkere отвечает, что тогда незачем держать клавиатуру, а в итоге Nix срывается на «Женька», пока тиммейт не просит Сашу забить"
    title: "никс сгорел на аункера после пистолетки"
    title_alt: ["один соло на четверых", "ищут виноватого с первого раунда"]
    desc: "Nix / Никс и Aunkere на BetBoom Streamers Battle. кто тут прав, по-вашему?"
    tags: [cs2, кс2, nix, никс, aunkere]
    layout: blur
    layouts: {blur: {focus_x: 0.3}}
    segments:
      # проигранная пистолетка глазами Nix, кто-то разбирает раунд
      - {start: 145.15, end: 149.3, layouts: {blur: {focus_x: 0.5}}}
      - {start: 149.3, end: 154.9, who: "Nix"}
      - {start: 154.9, end: 156.15, who: "Aunkere"}
      - {start: 156.15, end: 160.4, who: "Nix"}
      # тот же раунд глазами Solo: четыре убийства с USP, килфид крупно
      - {start: 164.0, end: 175.0, subs: false, layouts: {blur: {focus_x: 0.5}},
         inset: {rect: [0.70, 0.07, 0.30, 0.10], width: 760, at: [540, 300]}}
      - {start: 203.1, end: 208.8, who: "Aunkere"}
      - {start: 208.8, end: 234.5, who: "Nix"}
      - {start: 234.5, end: 236.42}

  - id: 02-udovolstvie
    format: монолог (нытьё целиком, с подрезкой)
    story: "клип о том, как после проигранного раунда Nix на вопрос «нормально всё?» выговаривается: у него 1700 эло, за каждую ошибку его пассивно гнобят, а он играет турнир ради удовольствия, и в итоге удовольствия нет, потому что от него ждут знания всех гранат"
    title: "никс кайфует от турнира"
    title_alt: ["играю ради удовольствия", "удовольствие от игры получено"]
    desc: "Nix / Никс на BetBoom Streamers Battle по CS2. знакомо, когда от тебя ждут больше твоего эло?"
    tags: [cs2, кс2, nix, никс, streamersbattle]
    layout: blur
    layouts: {blur: {focus_x: 0.6}}
    segments:
      # лицо Nix (4:48) под первую реплику, потом проигранный раунд, потом его же игра в этом матче
      # (под монологом в исходнике меню CS: игра переподключается)
      - {start: 407.25, end: 408.5, video_at: 287.9, layouts: {blur: {focus_x: 0.3}}}
      - {start: 408.55, end: 409.45, video_at: 289.2, who: "Nix", layouts: {blur: {focus_x: 0.3}}}
      - {start: 412.35, end: 418.95, layouts: {blur: {focus_x: 0.5}}}
      - {start: 419.0, end: 426.5, video_at: 318.4}
      - {start: 426.6, end: 439.55, video_at: 325.2}
      - {start: 439.55, end: 440.85, layouts: {blur: {focus_x: 0.5}}}
      - {start: 441.0, end: 448.0, video_at: 184.4}
      - {start: 448.0, end: 458.15, layouts: {blur: {focus_x: 0.5}}}

  - id: 03-karat
    format: момент → реакция (клатч под коллы)
    story: "клип о том, как degster забирает двоих с дигла, умирает и коллами ведёт Karat22, а в итоге Karat с Glock выигрывает раунд и degster орёт «Каратик, ты просто батя»"
    title: "карат затащил с глока"
    title_alt: ["лучший брат в клатче", "дегстер нашёл батю"]
    desc: "degster и Karat22. какой коллер нужен тебе в клатче?"
    tags: [cs2, кс2, degster, клатч]
    layout: blur
    layouts: {blur: {focus_x: 0.4}}
    subs_skip:                       # модели расходятся: «в идее» / «где», «Лучший!» / «Вау, чей!»
      - [395.5, 395.9]
      - [401.1, 401.8]
    segments:
      - {start: 378.5, end: 406.7, who: "degster"}
