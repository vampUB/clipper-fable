# Общие настройки нарезки. Любой параметр можно переопределить
# для конкретного проекта в work/<проект>/clips.yaml (секция defaults)
# или для отдельного клипа.

work_dir: work

output:
  width: 1080
  height: 1920
  fps: 30
  crf: 20            # меньше = лучше качество и больше файл (18-23 норм)
  preset: medium     # ultrafast..veryslow
  audio_bitrate: 160k
  loudnorm: true     # выровнять громкость под соцсети (~ -14 LUFS)
  audio_fade: 0.012  # микро-фейд звука на каждой склейке, сек (убирает щелчки); 0 — выключить

# Что закрывает интерфейс TikTok/Shorts/Reels (px из 1080×1920). `preview --safe` красит эти зоны.
# Цифры примерные (разные телефоны и длина описания) — важное в них не ставь.
safe_zone:
  top: 130
  bottom: 380
  right: 150

# Раскладки кадра. Прямоугольники задаются в ДОЛЯХ исходного кадра:
# [x, y, w, h], где 0..1 (0,0 — левый верхний угол).
# Узнать координаты вебки: python -m clipper frames <проект> --at 10:00 --grid
layouts:
  # Вебка сверху, геймплей снизу — классика для стримов
  stream:
    top_height: 700                 # высота блока вебки в px (из 1920)
    cam: [0.0, 0.0, 0.25, 0.30]     # где вебка на исходнике
    game: [0.0, 0.0, 1.0, 1.0]      # какую часть кадра брать под геймплей
    game_focus_x: 0.5               # куда смещать вертикальную вырезку (0 лево, 1 право)
  # Весь кадр по центру, сверху/снизу размытый фон
  blur:
    blur: 30
    darken: 0.35
    zoom: 1.0                       # >1 — подрезать края и увеличить
    height: null                    # высота картинки в px; больше 608 — края по бокам обрезаются
    y_offset: 0                     # сдвиг картинки по вертикали в px
    focus_x: 0.5                    # при height: какую часть по горизонтали оставить (0 лево, 1 право)
  # Просто вертикальная вырезка из кадра
  crop:
    rect: [0.0, 0.0, 1.0, 1.0]
    focus_x: 0.5

subs:
  enabled: true
  font: Montserrat Black
  size: 86
  color: "#FFFFFF"
  highlight: "#FFE500"          # цвет текущего слова
  outline: 6
  outline_color: "#000000"
  shadow: 2
  uppercase: true
  strip_punctuation: true
  censor: true                  # мат → звёздочка автоматически (п*здец, еб*ть, бл*дь, х*йня)
  max_words: 3                  # слов на экране одновременно
  max_chars: 20
  pop: true                     # активное слово чуть увеличено
  # Вертикальная позиция центра субтитров (px от верха, из 1920).
  # null — автоматически: для stream чуть ниже вебки, иначе ~ 72% высоты
  y: null
  # Ручные правки распознавания: "что распознал whisper" -> "как писать".
  # Ключ может быть фразой из нескольких слов ("быть бум": Бетбум); "" — убрать слово.
  replace: {}

title:
  enabled: true
  font: Montserrat Black
  size: 80
  color: "#000000"
  box_color: "#FFFFFF"
  uppercase: false              # строчными — так нравится пользователю (CLAUDE.md, раздел 7)
  duration: 3.5                 # секунд в начале клипа; 0 — весь клип
  y: null                       # null — автоматически

whisper:
  model: auto        # auto: large-v3 на GPU, small на CPU; можно tiny/base/small/medium/large-v3/turbo
  language: ru
  device: auto       # auto/cuda/cpu
  compute_type: auto
  # Модель для субтитров готовых клипов (перераспознаёт только их куски — точнее).
  # null — брать слова из общего transcript.json
  clip_model: null

analyze:
  top: 25               # сколько кандидатов выдавать
  min_gap: 90           # минимум секунд между кандидатами
  before: 25            # секунд до пика в предлагаемом окне
  after: 15             # секунд после пика
  chat_delay: 6         # на сколько секунд чат отстаёт от момента
  quiet_top: null       # сколько «тихих» кандидатов добавить (чат/речь активны, громкость обычная); null — top/3
  quiet_max_loudness: 1.0
  density_weight: 0.6
  weights:
    loudness: 1.0
    chat: 1.5
    speech: 0.7
  # Слова в речи стримера, которые часто означают хайлайт
  speech_keywords:
    - ааа
    - бля
    - нихуя
    - охуеть
    - пиздец
    - ебать
    - рампага
    - ультра
    - вау
    - да ладно
    - что за
    - ты видел
    - гг
  # Реакции чата
  chat_keywords:
    - kekw
    - lul
    - omegalul
    - pog
    - pogchamp
    - "???"
    - ахах
    - хаха
    - ")))"
    - лол
    - гг
    - "+"

# Поиск разговорных моментов по транскрипту: `python -m clipper talk <проект>` → talk.txt
# (запускается и сам после analyze, если есть transcript.json)
talk:
  top: 25               # сколько разговорных блоков показать
  block_gap: 2.0        # пауза, которая разделяет блоки, сек
  min_len: 8
  max_len: 70
  repeat_min: 3         # фраза/имя считается повтором с N раз
  repeat_apart: 20      # повторы ближе N секунд — один раз
  # Маркеры, по которым блок похож на клип. Ключ — метка в отчёте.
  markers:
    обращение к чату: ["ребят", "чат,", "чатик", "парни,", "пацаны", "вы знаете", "знаете", "слушайте"]
    история: ["короче", "помню", "однажды", "был случай", "история", "рассказ", "вчера", "в детстве", "как-то раз"]
    мнение: ["я считаю", "я думаю", "я вам скажу", "на самом деле", "честно", "по факту", "имба", "мусор", "бред", "умерла", "лучший", "худший", "позор"]
    объяснение: ["потому что", "смотри", "объясняю", "гайд", "секрет", "надо просто", "главное", "правило"]
    конфликт: ["ты ноешь", "заткнись", "не ной", "ты что", "зачем ты", "почему ты", "я же говорил", "из-за тебя", "руинишь", "репорт"]
    самоирония: ["я нормальный", "я не ", "я специально", "так и задумано", "это не я", "это не троллинг", "на контент", "разминочн"]
    эмоция: ["как так", "да ладно", "что это", "не может быть", "я в шоке", "серьёзно", "ты видел", "что он делает"]
    не про игру: ["поел", "еда", "сплю", "встал", "мама", "девушк", "школ", "работ", "деньги", "аниме", "фильм", "музык", "трек", "донат"]
  # Игровые команды: блок из одних колл-аутов — не разговор
  callouts: [" го ", "бей", "назад", "тп ", "байбек", "смок", "рошан", "фокус", "ульт", "бкб", "вард", " мид ", "пуш", "деф", "стан", "хекс"]
  # Сетап: обещание, прогноз, правило, уверенное заявление
  setup_keywords: ["сейчас я", "сейчас всё", "щас я", "обещаю", "гарантирую", "100%", "сто процентов", "точно выиграем", "точно проиграем", "изи", "не убью", "убью", "не проиграем", "выиграем", "никогда не", "правило", "ставлю", "спорим", "увидите", "покажу", "высушит", "разнесу", "папа", "не обосрусь", "запомните", "плохая команда", "без шансов"]
  # Развязка: признание, итог, переобувка
  payoff_keywords: ["я же говорил", "беру слова", "забудьте", "ошибался", "был неправ", "браво", "как так", "гг", "проиграли", "выиграли", "найс", "ну хотя бы", "ничего страшного", "зато", "погубило", "специально", "тайминг был", "ладно, ", "переобу"]

# Пороги `python -m clipper check` (можно переопределить в defaults плана)
check:
  min_len: 15           # короче — почти всегда обрывок (v10: «интересных клипов на 8 с не бывает»)
  max_len: 60
  hook_delay: 0.6       # первое слово позже — хук запаздывает
  tail_min: 0.25        # воздух после последнего слова
  tail_keep: 0.8
  tail_max: 1.5         # дольше — тянешь после панчлайна
  air: 1.2              # пауза внутри сегмента, которую стоит вырезать
