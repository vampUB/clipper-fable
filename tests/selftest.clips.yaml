# План для tests/selftest.sh. Клипы 02 и 03 нарочно плохие — на них check должен ругаться.
defaults:
  layouts:
    stream:
      cam: [0.0, 0.0, 0.25, 0.30]
      top_height: 612
  title: {duration: 3.5, uppercase: false}
  subs:
    replace:
      "быть бум": Бетбум
clips:
  - id: 01-pravila
    format: сетап → развязка
    story: "клип о том, как Никс придумал правило не ставить на Бетбум и в итоге оно его и погубило"
    title: "главное от своих идей не отходить"
    title_alt: ["правила пишутся кровью депозита"]
    desc: "Никс и его правила ставок"
    tags: [dota2, nix, ставки]
    layout: stream
    segments:
      - [4.9, 11.0]
      - [69.9, 73.6]
      - {start: 89.9, end: 94.2, layout: blur}
      - [123.9, 128.6]
  - id: 02-bkb
    format: суперкат
    title: "когда егор опять без бкб"
    layout: blur
    layouts: {blur: {height: 860, focus_x: 0.8}}
    segments:
      - [19.9, 22.6]
      - [44.9, 49.3]
      - {start: 80.0, end: 85.9, zoom: 1.3, focus: [0.5, 0.55]}
  - id: 03-obrubok
    format: суперкат
    title: "СМОТРИТЕ ЧТО БЫЛО."
    layout: crop
    segments:
      - [31.2, 39.0]          # нарочно режет слово «почему» и начинается с середины фразы
      - {start: 59.0, end: 61.0, speed: 0.5, text: "GG"}
  - id: 04-arbuz
    format: мини-гайд
    story: "клип о том, как Никс учит выбирать арбуз и в итоге выводит главное правило"
    title: "аналитик широкого профиля"
    layout: stream
    output: {progress_bar: true}
    segments:
      - [110.0, 123.0]
